<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: var(--font-sans); fill: hsl(var(--foreground)); font-size: 12px; }
    .lbl { font-size: 14px; font-weight: 480; }
    .note { font-size: 12px; fill: hsl(var(--muted-foreground)); }
    .box { fill: none; stroke: hsl(var(--muted-foreground)); stroke-width: 1; rx: 8; }
    .zone { fill: none; stroke: hsl(var(--border)); stroke-width: 1; stroke-dasharray: 4 3; rx: 8; }
    .wire { stroke: hsl(var(--muted-foreground)); stroke-width: 1; fill: none; }
    .acc { stroke: hsl(var(--accent)); stroke-width: 1; fill: none; }
    .accfill { fill: hsl(var(--accent)); }
    .accink { fill: hsl(var(--accent-foreground)); font-size: 11px; }
  </style>

  <text class="lbl" x="16" y="20">Today: position only</text>
  <rect class="zone" x="16" y="32" width="270" height="240"/>
  <rect class="box" x="36" y="52" width="200" height="40"/>
  <text class="lbl" x="48" y="77">Homework 1 (question)</text>
  <rect class="box" x="36" y="112" width="200" height="40"/>
  <text class="lbl" x="48" y="137">Solution 1</text>
  <text class="note" x="36" y="176">no owner id on the Solution heading</text>
  <text class="note" x="36" y="196">delete the question → Solution stays</text>
  <text class="note" x="36" y="216">move it → numbering follows the</text>
  <text class="note" x="36" y="232">nearest heading, not its question</text>

  <text class="lbl" x="354" y="20">After: one linked item</text>
  <rect class="zone" x="354" y="32" width="270" height="240"/>
  <rect class="acc" x="374" y="52" width="200" height="100" rx="8"/>
  <rect class="box" x="386" y="64" width="176" height="34"/>
  <text class="lbl" x="396" y="86">Question 1</text>
  <rect class="box" x="386" y="106" width="176" height="34"/>
  <text class="lbl" x="396" y="128">Solution 1</text>
  <circle class="accfill" cx="586" cy="60" r="9"/>
  <text class="accink" x="583" y="64">1</text>
  <text class="note" x="374" y="182">1 — Solution carries the question's</text>
  <text class="note" x="374" y="198">owner id, stamped at creation</text>
  <text class="note" x="374" y="222">delete / move / renumber the question</text>
  <text class="note" x="374" y="238">→ the solution follows it</text>

  <path class="wire" d="M292 152 L346 152" marker-end="url(#c)"/>
  <defs>
    <marker id="c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="hsl(var(--muted-foreground))"/>
    </marker>
  </defs>
</svg>
