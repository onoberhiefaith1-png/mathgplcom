<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" style="font-family: var(--font-sans)">
  <defs>
    <marker id="ch" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6" fill="none" stroke="hsl(var(--muted-foreground))" stroke-width="1"/>
    </marker>
  </defs>

  <text x="0" y="14" style="font-size:12px" fill="hsl(var(--muted-foreground))">today — one failure ends the run</text>
  <g stroke="hsl(var(--muted-foreground))" fill="none" stroke-width="1">
    <rect x="0" y="28" width="96" height="40" rx="8"/>
    <rect x="128" y="28" width="96" height="40" rx="8"/>
    <rect x="256" y="28" width="96" height="40" rx="8"/>
  </g>
  <text x="48" y="52" text-anchor="middle" style="font-size:14px;font-weight:480" fill="hsl(var(--foreground))">Example 1</text>
  <text x="176" y="52" text-anchor="middle" style="font-size:14px;font-weight:480" fill="hsl(var(--foreground))">Example 2</text>
  <text x="304" y="52" text-anchor="middle" style="font-size:14px;font-weight:480" fill="hsl(var(--foreground))">Example 3</text>
  <line x1="96" y1="48" x2="126" y2="48" stroke="hsl(var(--muted-foreground))" marker-end="url(#ch)"/>
  <line x1="224" y1="48" x2="254" y2="48" stroke="hsl(var(--muted-foreground))" marker-end="url(#ch)"/>
  <line x1="352" y1="48" x2="384" y2="48" stroke="hsl(var(--muted-foreground))" stroke-dasharray="4 3"/>
  <text x="392" y="52" style="font-size:12px" fill="hsl(var(--muted-foreground))">stops — classwork 1–4 never written</text>

  <text x="0" y="122" style="font-size:12px" fill="hsl(var(--muted-foreground))">after — the queue always reaches the end</text>
  <g stroke="hsl(var(--muted-foreground))" fill="none" stroke-width="1">
    <rect x="0" y="136" width="88" height="40" rx="8"/>
    <rect x="112" y="136" width="88" height="40" rx="8"/>
    <rect x="336" y="136" width="88" height="40" rx="8"/>
    <rect x="448" y="136" width="88" height="40" rx="8"/>
  </g>
  <rect x="224" y="136" width="88" height="40" rx="8" fill="none" stroke="hsl(var(--accent))" stroke-width="1"/>
  <text x="44" y="160" text-anchor="middle" style="font-size:14px;font-weight:480" fill="hsl(var(--foreground))">Example 1</text>
  <text x="156" y="160" text-anchor="middle" style="font-size:14px;font-weight:480" fill="hsl(var(--foreground))">Example 2</text>
  <text x="268" y="160" text-anchor="middle" style="font-size:14px;font-weight:480" fill="hsl(var(--accent-foreground))">Example 3</text>
  <text x="380" y="160" text-anchor="middle" style="font-size:14px;font-weight:480" fill="hsl(var(--foreground))">Classwork 1</text>
  <text x="492" y="160" text-anchor="middle" style="font-size:14px;font-weight:480" fill="hsl(var(--foreground))">…4</text>
  <line x1="88" y1="156" x2="110" y2="156" stroke="hsl(var(--muted-foreground))" marker-end="url(#ch)"/>
  <line x1="200" y1="156" x2="222" y2="156" stroke="hsl(var(--muted-foreground))" marker-end="url(#ch)"/>
  <line x1="312" y1="156" x2="334" y2="156" stroke="hsl(var(--muted-foreground))" marker-end="url(#ch)"/>
  <line x1="424" y1="156" x2="446" y2="156" stroke="hsl(var(--muted-foreground))" marker-end="url(#ch)"/>
  <circle cx="268" cy="196" r="9" fill="hsl(var(--accent))"/>
  <text x="268" y="200" text-anchor="middle" style="font-size:12px" fill="hsl(var(--accent-foreground))">1</text>
  <text x="284" y="200" style="font-size:12px" fill="hsl(var(--muted-foreground))">an item that fails is retried, then reported — the queue carries on</text>

  <g stroke="hsl(var(--muted-foreground))" fill="none" stroke-width="1">
    <rect x="0" y="232" width="200" height="56" rx="8"/>
  </g>
  <rect x="12" y="242" width="176" height="18" rx="4" fill="hsl(var(--muted))"/>
  <rect x="12" y="266" width="120" height="6" rx="3" fill="hsl(var(--border))"/>
  <rect x="12" y="276" width="150" height="6" rx="3" fill="hsl(var(--border))"/>
  <text x="216" y="252" style="font-size:12px" fill="hsl(var(--muted-foreground))">figure keeps its own band</text>
  <text x="216" y="272" style="font-size:12px" fill="hsl(var(--muted-foreground))">working starts below it, never across it</text>
</svg>
