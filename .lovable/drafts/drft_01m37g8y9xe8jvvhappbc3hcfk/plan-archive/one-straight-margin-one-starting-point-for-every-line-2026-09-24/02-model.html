<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" style="font-family: var(--font-sans)">
  <style>
    .lbl { font-size: 12px; fill: var(--fg-secondary); }
    .key { font-size: 14px; font-weight: 480; fill: var(--fg-primary); }
    .box { fill: none; stroke: var(--fg-secondary); stroke-width: 1; }
    .fill { fill: var(--bg-muted); }
    .greek { fill: var(--border-translucent); }
    .tag { font-size: 12px; fill: var(--fg-primary); }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="var(--fg-secondary)"/>
    </marker>
  </defs>

  <text class="key" x="8" y="16">Fixed surface start</text>
  <text class="lbl" x="470" y="16">right edge follows content</text>

  <rect class="box" x="40" y="30" width="500" height="180" rx="8"/>
  <rect class="fill" x="41" y="31" width="30" height="178"/>
  <rect class="fill" x="509" y="31" width="30" height="178"/>
  <text class="lbl" x="44" y="226">fold</text>
  <text class="lbl" x="512" y="226">fold</text>

  <!-- fixed tag gutter -->
  <line x1="130" y1="31" x2="130" y2="209" stroke="var(--border-translucent)" stroke-width="1"/>
  <text class="lbl" x="76" y="48">tag strip</text>
  <text class="tag" x="78" y="76">Line 0</text>
  <text class="tag" x="78" y="106">Line 1</text>
  <text class="tag" x="78" y="136">Line 2</text>
  <text class="tag" x="78" y="166">Line 3</text>

  <!-- the one straight margin -->
  <rect x="192" y="22" width="26" height="10" rx="5" fill="var(--bg-accent-translucent)" stroke="var(--fg-accent)" stroke-width="1"/>
  <text class="lbl" x="224" y="31" fill="var(--fg-accent)">handle moves this line only</text>
  <line x1="205" y1="34" x2="205" y2="205" stroke="var(--fg-accent)" stroke-width="1"/>

  <!-- lines all starting after margin -->
  <rect class="greek" x="215" y="68" width="230" height="10" rx="5"/>
  <rect class="greek" x="215" y="98" width="170" height="10" rx="5"/>
  <rect class="greek" x="215" y="128" width="205" height="10" rx="5"/>
  <rect class="greek" x="245" y="158" width="150" height="10" rx="5"/>
  <text class="lbl" x="400" y="167">indent allowed (never left of margin)</text>

  <line x1="450" y1="190" x2="502" y2="190" stroke="var(--fg-secondary)" stroke-width="1" marker-end="url(#ar)"/>

  <text class="lbl" x="40" y="264">margin X</text>
  <line x1="94" y1="260" x2="136" y2="260" stroke="var(--fg-secondary)" stroke-width="1" marker-end="url(#ar)"/>
  <text class="lbl" x="142" y="264">line start = margin + padding + indent</text>
  <line x1="352" y1="260" x2="394" y2="260" stroke="var(--fg-secondary)" stroke-width="1" marker-end="url(#ar)"/>
  <text class="lbl" x="400" y="264">measure once</text>
  <line x1="480" y1="260" x2="522" y2="260" stroke="var(--fg-secondary)" stroke-width="1" marker-end="url(#ar)"/>
  <text class="lbl" x="528" y="264">right edge</text>

  <text class="lbl" x="40" y="292">one value decides every line; nothing recalculates it afterwards</text>
</svg>
