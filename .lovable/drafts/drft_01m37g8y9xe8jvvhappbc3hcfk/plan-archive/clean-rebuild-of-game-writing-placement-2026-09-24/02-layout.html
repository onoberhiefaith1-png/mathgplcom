<svg viewBox="0 0 640 350" xmlns="http://www.w3.org/2000/svg" style="font-family: var(--font-sans)">

    .bar{fill:var(--border-translucent)}.accent{stroke:var(--fg-accent);stroke-width:1.5}.wire{stroke:var(--fg-secondary);stroke-width:1;fill:none}

  <defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8Z" fill="var(--fg-secondary)"/></marker></defs>

  <rect class="muted" x="530" y="53" width="34" height="218"/>

  <text class="label" x="106" y="227">Line 3</text><rect class="bar" x="210" y="217" width="176" height="11" rx="5"/>

  <text class="label" x="30" y="324">Every first glyph begins at the same derived X. No saved line position can move it back.</text>
</svg>
