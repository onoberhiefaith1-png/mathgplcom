<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" style="font-family: var(--font-sans)">
  <defs>
    <marker id="ch" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="hsl(var(--muted-foreground))" stroke-width="1.5"/>
    </marker>
  </defs>

  <text x="0" y="14" style="font-size:12px" fill="hsl(var(--muted-foreground))">Two kinds of student account</text>

  <!-- lane A: self signup -->
  <rect x="0" y="34" width="150" height="52" rx="8" fill="none" stroke="hsl(var(--muted-foreground))"/>
  <text x="75" y="58" text-anchor="middle" style="font-size:14px;font-weight:480" fill="hsl(var(--foreground))">Student signs</text>
  <text x="75" y="74" text-anchor="middle" style="font-size:14px;font-weight:480" fill="hsl(var(--foreground))">up themselves</text>

  <line x1="150" y1="60" x2="228" y2="60" stroke="hsl(var(--muted-foreground))" marker-end="url(#ch)"/>

  <rect x="230" y="34" width="170" height="52" rx="8" fill="none" stroke="hsl(var(--muted-foreground))"/>
  <text x="315" y="58" text-anchor="middle" style="font-size:14px;font-weight:480" fill="hsl(var(--foreground))">Own account</text>
  <text x="315" y="74" text-anchor="middle" style="font-size:12px" fill="hsl(var(--muted-foreground))">email + ID + password</text>

  <line x1="400" y1="60" x2="472" y2="60" stroke="hsl(var(--muted-foreground))" marker-end="url(#ch)"/>

  <rect x="474" y="34" width="166" height="52" rx="8" fill="none" stroke="hsl(var(--muted-foreground))"/>
  <text x="557" y="58" text-anchor="middle" style="font-size:14px;font-weight:480" fill="hsl(var(--foreground))">Many schools</text>
  <text x="557" y="74" text-anchor="middle" style="font-size:12px" fill="hsl(var(--muted-foreground))">switcher available</text>

  <!-- lane B: school-created -->
  <rect x="0" y="126" width="150" height="52" rx="8" fill="hsl(var(--accent))" stroke="hsl(var(--muted-foreground))"/>
  <text x="75" y="150" text-anchor="middle" style="font-size:14px;font-weight:480" fill="hsl(var(--accent-foreground))">School or teacher</text>
  <text x="75" y="166" text-anchor="middle" style="font-size:14px;font-weight:480" fill="hsl(var(--accent-foreground))">creates it</text>

  <line x1="150" y1="152" x2="228" y2="152" stroke="hsl(var(--muted-foreground))" marker-end="url(#ch)"/>

  <rect x="230" y="126" width="170" height="52" rx="8" fill="none" stroke="hsl(var(--muted-foreground))"/>
  <text x="315" y="150" text-anchor="middle" style="font-size:14px;font-weight:480" fill="hsl(var(--foreground))">Managed account</text>
  <text x="315" y="166" text-anchor="middle" style="font-size:12px" fill="hsl(var(--muted-foreground))">ID + password, no email</text>

  <line x1="400" y1="152" x2="472" y2="152" stroke="hsl(var(--muted-foreground))" marker-end="url(#ch)"/>

  <rect x="474" y="126" width="166" height="52" rx="8" fill="none" stroke="hsl(var(--muted-foreground))"/>
  <text x="557" y="150" text-anchor="middle" style="font-size:14px;font-weight:480" fill="hsl(var(--foreground))">That school only</text>
  <text x="557" y="166" text-anchor="middle" style="font-size:12px" fill="hsl(var(--muted-foreground))">no switcher</text>

  <!-- ID check zone -->
  <rect x="0" y="212" width="640" height="104" rx="8" fill="none" stroke="hsl(var(--border))" stroke-dasharray="4 3"/>
  <text x="14" y="234" style="font-size:12px" fill="hsl(var(--muted-foreground))">choosing an ID (same rules everywhere)</text>

  <rect x="18" y="246" width="150" height="50" rx="8" fill="none" stroke="hsl(var(--muted-foreground))"/>
  <text x="93" y="276" text-anchor="middle" style="font-size:14px;font-weight:480" fill="hsl(var(--foreground))">type wanted ID</text>

  <line x1="168" y1="271" x2="222" y2="271" stroke="hsl(var(--muted-foreground))" marker-end="url(#ch)"/>

  <rect x="224" y="246" width="180" height="50" rx="8" fill="none" stroke="hsl(var(--muted-foreground))"/>
  <text x="314" y="270" text-anchor="middle" style="font-size:14px;font-weight:480" fill="hsl(var(--foreground))">availability check</text>
  <text x="314" y="286" text-anchor="middle" style="font-size:12px" fill="hsl(var(--muted-foreground))">chosen + issued IDs</text>

  <line x1="404" y1="262" x2="458" y2="262" stroke="hsl(var(--muted-foreground))" marker-end="url(#ch)"/>
  <line x1="404" y1="282" x2="458" y2="282" stroke="hsl(var(--muted-foreground))" stroke-dasharray="4 3" marker-end="url(#ch)"/>

  <rect x="460" y="242" width="164" height="34" rx="17" fill="none" stroke="hsl(var(--muted-foreground))"/>
  <text x="542" y="264" text-anchor="middle" style="font-size:12px" fill="hsl(var(--foreground))">free — saved</text>

  <rect x="460" y="284" width="164" height="34" rx="17" fill="none" stroke="hsl(var(--muted-foreground))"/>
  <text x="542" y="306" text-anchor="middle" style="font-size:12px" fill="hsl(var(--foreground))">taken — refused</text>
</svg>
