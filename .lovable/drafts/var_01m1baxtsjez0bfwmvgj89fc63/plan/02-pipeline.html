<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="How generated content becomes editable objects">
  <style>
    text { font-family: var(--font-sans); fill: hsl(var(--foreground)); }
    .lbl { font-size: 14px; font-weight: 480; }
    .note { font-size: 12px; fill: hsl(var(--muted-foreground)); }
    .box { fill: none; stroke: hsl(var(--muted-foreground)); stroke-width: 1; }
    .zone { fill: none; stroke: hsl(var(--border)); stroke-width: 1; stroke-dasharray: 4 3; }
    .wire { stroke: hsl(var(--muted-foreground)); stroke-width: 1; fill: none; }
    .acc { fill: none; stroke: hsl(var(--accent)); stroke-width: 1; }
    .accink { fill: hsl(var(--accent)); }
  </style>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6" fill="none" stroke="hsl(var(--muted-foreground))" stroke-width="1"/>
    </marker>
  </defs>

  <rect class="box" x="16" y="40" width="120" height="48" rx="8"/>
  <text class="lbl" x="76" y="69" text-anchor="middle">AI output</text>

  <rect class="acc" x="176" y="40" width="150" height="48" rx="8"/>
  <text class="lbl" x="251" y="62" text-anchor="middle">repair pass</text>
  <text class="note" x="251" y="79" text-anchor="middle">restore macro · drop empty bar</text>

  <line class="wire" x1="140" y1="64" x2="172" y2="64" marker-end="url(#a)"/>
  <line class="wire" x1="330" y1="64" x2="366" y2="64" marker-end="url(#a)"/>

  <rect class="box" x="370" y="40" width="140" height="48" rx="8"/>
  <text class="lbl" x="440" y="69" text-anchor="middle">classifier</text>

  <rect class="zone" x="360" y="110" width="264" height="164" rx="8"/>
  <text class="note" x="372" y="128">editable objects</text>

  <rect class="box" x="376" y="140" width="110" height="40" rx="8"/>
  <text class="lbl" x="431" y="165" text-anchor="middle">diagram</text>
  <rect class="box" x="500" y="140" width="110" height="40" rx="8"/>
  <text class="lbl" x="555" y="165" text-anchor="middle">table</text>
  <rect class="box" x="376" y="196" width="110" height="40" rx="8"/>
  <text class="lbl" x="431" y="221" text-anchor="middle">matrix</text>
  <rect class="box" x="500" y="196" width="110" height="40" rx="8"/>
  <text class="lbl" x="555" y="221" text-anchor="middle">math line</text>

  <line class="wire" x1="440" y1="92" x2="440" y2="136" marker-end="url(#a)"/>

  <circle class="accink" cx="30" cy="150" r="9"/>
  <text x="30" y="154" text-anchor="middle" font-size="11" fill="hsl(var(--accent-foreground))">1</text>
  <text class="note" x="48" y="154">no empty fraction shell survives the repair pass</text>
  <circle class="accink" cx="30" cy="182" r="9"/>
  <text x="30" y="186" text-anchor="middle" font-size="11" fill="hsl(var(--accent-foreground))">2</text>
  <text class="note" x="48" y="186">figures, tables and matrices become system objects</text>
  <circle class="accink" cx="30" cy="214" r="9"/>
  <text x="30" y="218" text-anchor="middle" font-size="11" fill="hsl(var(--accent-foreground))">3</text>
  <text class="note" x="48" y="218">every object stays editable by the teacher</text>
</svg>
