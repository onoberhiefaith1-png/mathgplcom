<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" style="font-family: var(--font-sans)">
  <style>
    .lbl { fill: hsl(var(--foreground)); font-size: 14px; font-weight: 480; }
    .note { fill: hsl(var(--muted-foreground)); font-size: 12px; }
    .box { fill: none; stroke: hsl(var(--muted-foreground)); stroke-width: 1; }
    .zone { fill: none; stroke: hsl(var(--border)); stroke-width: 1; stroke-dasharray: 4 3; }
    .wire { stroke: hsl(var(--muted-foreground)); stroke-width: 1; fill: none; }
    .acc { fill: none; stroke: hsl(var(--accent)); stroke-width: 1; }
    .accink { fill: hsl(var(--accent)); font-size: 12px; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8" fill="none" stroke="hsl(var(--muted-foreground))" stroke-width="1"/>
    </marker>
  </defs>

  <rect class="box" x="8" y="40" width="120" height="56" rx="8"/>
  <text class="lbl" x="68" y="64" text-anchor="middle">AI lesson text</text>
  <text class="note" x="68" y="82" text-anchor="middle">raw generation</text>

  <line class="wire" x1="128" y1="68" x2="168" y2="68" marker-end="url(#a)"/>

  <rect class="acc" x="168" y="30" width="150" height="76" rx="8"/>
  <text class="lbl" x="243" y="54" text-anchor="middle">Unit decomposition</text>
  <text class="accink" x="243" y="74" text-anchor="middle">1 question = 1 section</text>
  <text class="note" x="243" y="92" text-anchor="middle">splits (a)/(b), 1./2.</text>

  <line class="wire" x1="318" y1="68" x2="358" y2="68" marker-end="url(#a)"/>

  <rect class="box" x="358" y="40" width="130" height="56" rx="8"/>
  <text class="lbl" x="423" y="64" text-anchor="middle">Item N + Solution N</text>
  <text class="note" x="423" y="82" text-anchor="middle">paired one-to-one</text>

  <line class="wire" x1="488" y1="68" x2="528" y2="68" marker-end="url(#a)"/>

  <rect class="box" x="528" y="40" width="104" height="56" rx="8"/>
  <text class="lbl" x="580" y="64" text-anchor="middle">Validate</text>
  <text class="note" x="580" y="82" text-anchor="middle">no gaps allowed</text>

  <line class="wire" x1="580" y1="96" x2="580" y2="150" marker-end="url(#a)"/>

  <rect class="zone" x="8" y="150" width="624" height="130" rx="8"/>
  <text class="note" x="24" y="170">rendering guarantees</text>

  <rect class="box" x="32" y="186" width="176" height="72" rx="8"/>
  <text class="lbl" x="120" y="212" text-anchor="middle">Label integrity</text>
  <text class="note" x="120" y="232" text-anchor="middle">"Solution 2" stays whole</text>
  <text class="note" x="120" y="248" text-anchor="middle">heading, never math</text>

  <rect class="box" x="232" y="186" width="176" height="72" rx="8"/>
  <text class="lbl" x="320" y="212" text-anchor="middle">Math structures</text>
  <text class="note" x="320" y="232" text-anchor="middle">\frac12 renders 1 over 2</text>
  <text class="note" x="320" y="248" text-anchor="middle">no leaked operands</text>

  <rect class="box" x="432" y="186" width="176" height="72" rx="8"/>
  <text class="lbl" x="520" y="212" text-anchor="middle">Contrast</text>
  <text class="note" x="520" y="232" text-anchor="middle">feedback and check text</text>
  <text class="note" x="520" y="248" text-anchor="middle">full-strength ink</text>
</svg>
