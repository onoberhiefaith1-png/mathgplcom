<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Final Touch scans one revolution, measures four glitch types, and writes existing settings">
  <style>
    text { font-family: var(--font-sans); fill: hsl(var(--muted-foreground)); font-size: 12px; }
    .lbl { fill: hsl(var(--foreground)); font-size: 14px; font-weight: 480; }
    .box { fill: none; stroke: hsl(var(--muted-foreground)); stroke-width: 1; }
    .zone { fill: none; stroke: hsl(var(--border)); stroke-width: 1; stroke-dasharray: 4 3; }
    .wire { stroke: hsl(var(--muted-foreground)); stroke-width: 1; fill: none; }
    .acc { fill: none; stroke: hsl(var(--accent)); stroke-width: 1; }
  </style>
  <defs>
    <marker id="ch" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1 1 L6 4 L1 7" fill="none" stroke="hsl(var(--muted-foreground))" stroke-width="1"/>
    </marker>
  </defs>

  <rect class="box" x="12" y="112" width="120" height="56" rx="8"/>
  <text class="lbl" x="72" y="136" text-anchor="middle">Final Touch</text>
  <text x="72" y="154" text-anchor="middle">one revolution</text>

  <line class="wire" x1="132" y1="140" x2="188" y2="140" marker-end="url(#ch)"/>

  <rect class="zone" x="188" y="24" width="184" height="252" rx="8"/>
  <text x="196" y="42">measure every frame</text>
  <rect class="box" x="204" y="54" width="152" height="34" rx="8"/>
  <text class="lbl" x="280" y="76" text-anchor="middle">edge halo</text>
  <rect class="box" x="204" y="98" width="152" height="34" rx="8"/>
  <text class="lbl" x="280" y="120" text-anchor="middle">flicker between frames</text>
  <rect class="box" x="204" y="142" width="152" height="34" rx="8"/>
  <text class="lbl" x="280" y="164" text-anchor="middle">leftover backdrop</text>
  <rect class="box" x="204" y="186" width="152" height="34" rx="8"/>
  <text class="lbl" x="280" y="208" text-anchor="middle">first vs last frame</text>
  <text x="280" y="242" text-anchor="middle">worst frame wins, not the best</text>

  <line class="wire" x1="372" y1="140" x2="428" y2="140" marker-end="url(#ch)"/>

  <rect class="acc" x="428" y="54" width="196" height="122" rx="8"/>
  <text class="lbl" x="526" y="76" text-anchor="middle">existing settings, retuned</text>
  <text x="526" y="98" text-anchor="middle">key colour · tolerance</text>
  <text x="526" y="118" text-anchor="middle">edge softness · blend</text>
  <text x="526" y="138" text-anchor="middle">loop crossfade</text>
  <text x="526" y="162" text-anchor="middle">still hand-editable</text>

  <rect class="box" x="428" y="200" width="196" height="48" rx="8"/>
  <text class="lbl" x="526" y="222" text-anchor="middle">Save Building</text>
  <text x="526" y="240" text-anchor="middle">homepage unchanged until then</text>
  <line class="wire" x1="526" y1="176" x2="526" y2="200" marker-end="url(#ch)"/>
</svg>
