<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: var(--font-sans); fill: hsl(var(--foreground)); }
    .s { font-size: 12px; fill: hsl(var(--muted-foreground)); }
    .b { font-size: 14px; font-weight: 480; }
    .box { fill: none; stroke: hsl(var(--muted-foreground)); stroke-width: 1; }
    .zone { fill: none; stroke: hsl(var(--border)); stroke-width: 1; stroke-dasharray: 4 3; }
    .rail { stroke: hsl(var(--border)); stroke-width: 1; }
  </style>

  <rect class="zone" x="8" y="8" width="300" height="272" rx="8"/>
  <text class="s" x="22" y="28">now — picture hidden behind the back panel</text>
  <line class="rail" x1="24" y1="250" x2="290" y2="250"/>
  <text class="s" x="24" y="268">wall</text>

  <rect class="box" x="60" y="60" width="24" height="170" rx="8"/>
  <text class="s" x="72" y="248" text-anchor="middle">wall</text>
  <rect x="96" y="60" width="26" height="170" rx="8" fill="hsl(var(--accent))"/>
  <text class="s" x="109" y="248" text-anchor="middle">picture</text>
  <rect class="box" x="134" y="60" width="30" height="170" rx="8"/>
  <text class="s" x="149" y="248" text-anchor="middle">back</text>
  <rect class="box" x="176" y="60" width="26" height="170" rx="8"/>
  <text class="s" x="189" y="248" text-anchor="middle">glass</text>
  <text class="b" x="248" y="150">you see</text>
  <text class="s" x="248" y="168">the back panel</text>

  <rect class="zone" x="332" y="8" width="300" height="272" rx="8"/>
  <text class="s" x="346" y="28">after — picture is the inside surface</text>
  <line class="rail" x1="348" y1="250" x2="614" y2="250"/>

  <rect class="box" x="384" y="60" width="24" height="170" rx="8"/>
  <text class="s" x="396" y="248" text-anchor="middle">wall</text>
  <rect class="box" x="420" y="60" width="30" height="170" rx="8"/>
  <text class="s" x="435" y="248" text-anchor="middle">back*</text>
  <rect x="462" y="60" width="26" height="170" rx="8" fill="hsl(var(--accent))"/>
  <text class="s" x="475" y="248" text-anchor="middle">picture</text>
  <rect class="box" x="500" y="60" width="26" height="170" rx="8"/>
  <text class="s" x="513" y="248" text-anchor="middle">glass</text>
  <text class="b" x="546" y="150">you see</text>
  <text class="s" x="546" y="168">the picture</text>
  <text class="s" x="348" y="284">* only shows when nothing is inside</text>
</svg>
