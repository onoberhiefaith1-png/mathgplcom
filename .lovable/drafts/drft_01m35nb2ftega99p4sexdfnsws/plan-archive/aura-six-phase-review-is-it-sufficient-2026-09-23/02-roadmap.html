<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" style="font-family: var(--font-sans); color: var(--fg-primary);">
  <!-- Lane: phases -->
  <text x="16" y="30" font-size="12" fill="var(--fg-secondary)">AURA BUILD SEQUENCE</text>

  <!-- Phase boxes -->
  <g font-size="13" font-weight="480" text-anchor="middle">
    <rect x="16"  y="48" width="120" height="52" rx="8" fill="var(--bg-muted)" stroke="var(--fg-secondary)"/>
    <text x="76"  y="70" fill="var(--fg-primary)">Phase 1 · Hands</text>
    <text x="76"  y="88" font-size="11" fill="var(--fg-secondary)">12 tools — done</text>

    <rect x="160" y="48" width="120" height="52" rx="8" fill="var(--bg-muted)" stroke="var(--fg-secondary)"/>
    <text x="220" y="70" fill="var(--fg-primary)">Phase 2 · Brain</text>
    <text x="220" y="88" font-size="11" fill="var(--fg-secondary)">reasoning loop — done</text>

    <rect x="304" y="48" width="120" height="52" rx="8" fill="var(--bg-accent-translucent)" stroke="var(--fg-accent)"/>
    <text x="364" y="70" fill="var(--fg-accent)">Phase 3 · Cockpit</text>
    <text x="364" y="88" font-size="11" fill="var(--fg-accent)">next up</text>

    <rect x="448" y="48" width="88" height="52" rx="8" fill="var(--bg-muted)" stroke="var(--fg-secondary)"/>
    <text x="492" y="70" fill="var(--fg-primary)">Phase 4</text>
    <text x="492" y="88" font-size="11" fill="var(--fg-secondary)">Voice</text>

    <rect x="548" y="48" width="76" height="52" rx="8" fill="var(--bg-muted)" stroke="var(--fg-secondary)"/>
    <text x="586" y="70" fill="var(--fg-primary)">Phase 5</text>
    <text x="586" y="88" font-size="11" fill="var(--fg-secondary)">Live board</text>
  </g>

  <line x1="136" y1="74" x2="160" y2="74" stroke="var(--fg-secondary)"/>
  <line x1="280" y1="74" x2="304" y2="74" stroke="var(--fg-secondary)"/>
  <line x1="424" y1="74" x2="448" y2="74" stroke="var(--fg-secondary)"/>
  <line x1="536" y1="74" x2="548" y2="74" stroke="var(--fg-secondary)"/>

  <rect x="16" y="118" width="120" height="40" rx="8" fill="var(--bg-muted)" stroke="var(--fg-secondary)"/>
  <text x="76" y="142" font-size="13" font-weight="480" text-anchor="middle" fill="var(--fg-primary)">Phase 6</text>

  <line x1="586" y1="100" x2="586" y2="138" stroke="var(--fg-secondary)" stroke-dasharray="4 3"/>
  <line x1="136" y1="138" x2="586" y2="138" stroke="var(--fg-secondary)" stroke-dasharray="4 3"/>
  <line x1="136" y1="138" x2="136" y2="118" stroke="var(--fg-secondary)" stroke-dasharray="4 3"/>

  <!-- Addition 1: tool expansion -->
  <rect x="304" y="176" width="320" height="44" rx="8" fill="none" stroke="var(--fg-secondary)"/>
  <text x="316" y="194" font-size="12" fill="var(--fg-primary)">Addition 1 — Tool expansion pass</text>
  <text x="316" y="210" font-size="11" fill="var(--fg-secondary)">quizzes · assessments · game building · Adventure ·</text>
  <text x="316" y="224" font-size="11" fill="var(--fg-secondary)">enrollment · performance · Smart Cards — text first</text>
  <line x1="364" y1="100" x2="364" y2="176" stroke="var(--fg-secondary)" stroke-dasharray="4 3"/>

  <!-- Addition 2: memory -->
  <rect x="304" y="240" width="320" height="40" rx="8" fill="none" stroke="var(--fg-secondary)"/>
  <text x="316" y="258" font-size="12" fill="var(--fg-primary)">Addition 2 — Conversation memory</text>
  <text x="316" y="272" font-size="11" fill="var(--fg-secondary)">persisted chat history, resume where you left off</text>
  <line x1="424" y1="100" x2="424" y2="240" stroke="var(--fg-secondary)" stroke-dasharray="4 3"/>

  <!-- Addition 3: ceilings -->
  <rect x="16" y="240" width="240" height="40" rx="8" fill="none" stroke="var(--fg-secondary)"/>
  <text x="28" y="258" font-size="12" fill="var(--fg-primary)">Addition 3 — Usage ceilings</text>
  <text x="28" y="272" font-size="11" fill="var(--fg-secondary)">daily action caps · inactivity pause</text>
  <line x1="76" y1="158" x2="76" y2="240" stroke="var(--fg-secondary)" stroke-dasharray="4 3"/>

  <!-- Milestones -->
  <text x="16" y="316" font-size="12" fill="var(--fg-secondary)">WHAT THE TEACHER CAN DO</text>
  <g font-size="12" fill="var(--fg-primary)">
    <rect x="304" y="300" width="320" height="30" rx="15" fill="var(--bg-muted)"/>
    <text x="464" y="319" text-anchor="middle">After 3: types, AURA runs the whole platform</text>
    <rect x="448" y="338" width="176" height="30" rx="15" fill="var(--bg-muted)"/>
    <text x="536" y="357" text-anchor="middle">After 4: speaks + listens</text>
    <rect x="548" y="366" width="76" height="30" rx="15" fill="var(--bg-muted)"/>
    <text x="586" y="385" text-anchor="middle" font-size="11">After 5: teaches</text>
  </g>
</svg>
