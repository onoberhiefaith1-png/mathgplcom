<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: var(--font-sans); fill: var(--fg-primary); }
    .lbl { font-size: 14px; font-weight: 480; }
    .note { font-size: 12px; fill: var(--fg-secondary); }
    .tag { font-size: 12px; fill: var(--fg-secondary); }
    .box { fill: none; stroke: var(--fg-secondary); stroke-width: 1; }
    .wire { stroke: var(--fg-secondary); stroke-width: 1; fill: none; }
    .zone { fill: none; stroke: var(--border-translucent); stroke-width: 1; stroke-dasharray: 4 3; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8" fill="none" stroke="var(--fg-secondary)" stroke-width="1"/>
    </marker>
  </defs>

  <text class="tag" x="16" y="22">today — two listeners, one microphone</text>
  <rect class="box" x="16" y="34" width="150" height="44" rx="8"/>
  <text class="lbl" x="91" y="61" text-anchor="middle">Ear (wake word)</text>
  <rect class="box" x="16" y="92" width="150" height="44" rx="8"/>
  <text class="lbl" x="91" y="119" text-anchor="middle">Recorder button</text>
  <path class="wire" d="M166 56 H236" marker-end="url(#a)"/>
  <path class="wire" d="M166 114 H236" marker-end="url(#a)"/>
  <rect class="box" x="236" y="63" width="120" height="44" rx="8"/>
  <text class="lbl" x="296" y="90" text-anchor="middle">microphone</text>
  <text class="note" x="372" y="80">second one fails,</text>
  <text class="note" x="372" y="96">silently — nothing heard</text>

  <line x1="16" y1="160" x2="624" y2="160" stroke="var(--border-translucent)" stroke-width="1"/>

  <text class="tag" x="16" y="184">after — one shared listening engine</text>
  <rect class="zone" x="16" y="196" width="330" height="88" rx="8"/>
  <text class="tag" x="28" y="214">one microphone session</text>
  <rect x="28" y="222" width="140" height="50" rx="8" fill="var(--bg-accent-translucent)" stroke="var(--fg-accent)" stroke-width="1"/>
  <text class="lbl" x="98" y="244" text-anchor="middle" fill="var(--fg-accent)">listening engine</text>
  <text class="note" x="98" y="262" text-anchor="middle" fill="var(--fg-accent)">level + words</text>
  <rect class="box" x="188" y="222" width="146" height="50" rx="8"/>
  <text class="lbl" x="261" y="244" text-anchor="middle">wake word + recorder</text>
  <text class="note" x="261" y="262" text-anchor="middle">both read from it</text>

  <path class="wire" d="M346 247 H406" marker-end="url(#a)"/>
  <rect class="box" x="406" y="196" width="218" height="88" rx="8"/>
  <text class="lbl" x="515" y="220" text-anchor="middle">what you see</text>
  <g stroke="var(--fg-accent)" stroke-width="3" stroke-linecap="round">
    <line x1="432" y1="252" x2="432" y2="262"/>
    <line x1="444" y1="240" x2="444" y2="274"/>
    <line x1="456" y1="246" x2="456" y2="268"/>
    <line x1="468" y1="234" x2="468" y2="280"/>
    <line x1="480" y1="248" x2="480" y2="266"/>
    <line x1="492" y1="238" x2="492" y2="276"/>
    <line x1="504" y1="252" x2="504" y2="262"/>
  </g>
  <rect x="520" y="246" width="88" height="8" rx="4" fill="var(--border-translucent)"/>
  <rect x="520" y="260" width="62" height="8" rx="4" fill="var(--border-translucent)"/>
  <text class="note" x="564" y="238" text-anchor="middle">live words</text>
</svg>
