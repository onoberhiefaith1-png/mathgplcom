<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" role="img" aria-label="Microphone permission flow and the four states">
  <style>
    .lbl { font-family: var(--font-sans); font-size: 14px; font-weight: 480; fill: var(--fg-primary); }
    .sm  { font-family: var(--font-sans); font-size: 12px; fill: var(--fg-secondary); }
    .mono{ font-family: var(--font-mono); font-size: 12px; fill: var(--fg-secondary); }
    .box { fill: none; stroke: var(--fg-secondary); stroke-width: 1; }
    .acc { fill: var(--bg-accent-translucent); stroke: none; }
    .wire{ stroke: var(--fg-secondary); stroke-width: 1; fill: none; }
    .halo{ paint-order: stroke; stroke: var(--bg-primary); stroke-width: 3px; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8" fill="none" stroke="var(--fg-secondary)" stroke-width="1"/>
    </marker>
  </defs>

  <rect class="box" x="8" y="20" width="150" height="48" rx="8"/>
  <text class="lbl" x="83" y="41" text-anchor="middle">Aura opens</text>
  <text class="sm" x="83" y="58" text-anchor="middle">status: not enabled</text>

  <line class="wire" x1="158" y1="44" x2="204" y2="44" marker-end="url(#a)"/>

  <rect class="box" x="206" y="20" width="176" height="48" rx="8"/>
  <text class="lbl" x="294" y="41" text-anchor="middle">Allow Microphone</text>
  <text class="sm" x="294" y="58" text-anchor="middle">one click, status: asking</text>

  <line class="wire" x1="382" y1="44" x2="428" y2="44" marker-end="url(#a)"/>

  <rect class="box" x="430" y="20" width="202" height="48" rx="8"/>
  <text class="mono" x="531" y="41" text-anchor="middle">getUserMedia({ audio: true })</text>
  <text class="sm" x="531" y="58" text-anchor="middle">the one request</text>

  <line class="wire" x1="531" y1="68" x2="531" y2="100" marker-end="url(#a)"/>
  <line class="wire" x1="531" y1="92" x2="108" y2="92"/>
  <line class="wire" x1="108" y1="92" x2="108" y2="118" marker-end="url(#a)"/>
  <line class="wire" x1="531" y1="92" x2="531" y2="118" marker-end="url(#a)"/>
  <line class="wire" x1="248" y1="92" x2="248" y2="118" marker-end="url(#a)"/>
  <line class="wire" x1="390" y1="92" x2="390" y2="118" marker-end="url(#a)"/>

  <rect class="acc" x="30" y="120" width="156" height="72" rx="8"/>
  <text class="lbl" x="108" y="146" text-anchor="middle" fill="var(--fg-accent)">Listening</text>
  <text class="sm" x="108" y="164" text-anchor="middle">stream kept and used</text>
  <text class="sm" x="108" y="180" text-anchor="middle">green · starts at once</text>

  <rect class="box" x="176" y="120" width="144" height="72" rx="8"/>
  <text class="lbl" x="248" y="146" text-anchor="middle">Blocked</text>
  <text class="mono" x="248" y="164" text-anchor="middle">NotAllowedError</text>
  <text class="sm" x="248" y="180" text-anchor="middle">how to unblock</text>

  <rect class="box" x="322" y="120" width="140" height="72" rx="8"/>
  <text class="lbl" x="392" y="146" text-anchor="middle">In use / failed</text>
  <text class="mono" x="392" y="164" text-anchor="middle">NotReadableError</text>
  <text class="sm" x="392" y="180" text-anchor="middle">close other app, retry</text>

  <rect class="box" x="466" y="120" width="160" height="72" rx="8"/>
  <text class="lbl" x="546" y="146" text-anchor="middle">No microphone</text>
  <text class="mono" x="546" y="164" text-anchor="middle">NotFoundError +</text>
  <text class="sm" x="546" y="180" text-anchor="middle">device list confirms none</text>

  <rect x="30" y="224" width="596" height="82" rx="8" fill="var(--bg-muted)"/>
  <circle cx="60" cy="252" r="9" fill="var(--bg-accent-translucent)"/>
  <text class="sm" x="60" y="256" text-anchor="middle" fill="var(--fg-accent)">1</text>
  <text class="sm" x="80" y="256">The stream from that single request is handed straight to the listening engine — it is never opened twice.</text>
  <circle cx="60" cy="282" r="9" fill="var(--bg-accent-translucent)"/>
  <text class="sm" x="60" y="286" text-anchor="middle" fill="var(--fg-accent)">2</text>
  <text class="sm" x="80" y="286">"No microphone" is only ever shown after the device list confirms there is no audio input at all.</text>
</svg>
