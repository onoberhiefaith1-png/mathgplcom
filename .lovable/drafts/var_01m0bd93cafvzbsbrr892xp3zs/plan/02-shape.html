<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: var(--font-sans); fill: hsl(var(--muted-foreground)); font-size: 12px; }
    .lbl { fill: hsl(var(--foreground)); font-size: 14px; font-weight: 480; }
    .bx { fill: none; stroke: hsl(var(--muted-foreground)); stroke-width: 1; }
    .zone { fill: none; stroke: hsl(var(--border)); stroke-width: 1; stroke-dasharray: 4 3; }
    .q { fill: hsl(var(--muted)); }
    .w { stroke: hsl(var(--muted-foreground)); stroke-width: 1; fill: none; }
  </style>
  <defs>
    <marker id="cv" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0 L6 3.5 L0 7" fill="none" stroke="hsl(var(--muted-foreground))" stroke-width="1"/>
    </marker>
  </defs>

  <!-- shared config -->
  <rect class="zone" x="8" y="14" width="230" height="300" rx="8"/>
  <text x="20" y="32">one shared config</text>
  <g>
    <rect class="bx" x="24" y="44" width="198" height="26" rx="8"/><text class="lbl" x="36" y="61">Transform · Layer · Motion</text>
    <rect class="bx" x="24" y="78" width="198" height="26" rx="8"/><text class="lbl" x="36" y="95">Slant · Name · Questions</text>
    <rect class="bx" x="24" y="112" width="198" height="26" rx="8"/><text class="lbl" x="36" y="129">Scoring: current / total</text>
    <rect class="bx" x="24" y="146" width="198" height="26" rx="8"/><text class="lbl" x="36" y="163">Style · Frame</text>
    <rect class="bx" x="24" y="180" width="198" height="26" rx="8" stroke="hsl(var(--accent))"/><text class="lbl" x="36" y="197">Fill: plain colour | energy</text>
    <text x="24" y="228">progress = current ÷ total, clamped 0–100%</text>
    <text x="24" y="248">particle count from area × density,</text>
    <text x="24" y="264">never from question count</text>
  </g>

  <line class="w" x1="238" y1="120" x2="292" y2="86" marker-end="url(#cv)"/>
  <line class="w" x1="238" y1="200" x2="292" y2="234" marker-end="url(#cv)"/>

  <!-- segmented -->
  <text class="lbl" x="300" y="40">Segmented / 10-slot</text>
  <rect class="bx" x="300" y="52" width="60" height="120" rx="8"/>
  <g>
    <rect class="q" x="306" y="136" width="48" height="14"/>
    <rect class="q" x="306" y="152" width="48" height="14"/>
    <line class="w" x1="306" y1="136" x2="354" y2="136"/>
    <line class="w" x1="306" y1="120" x2="354" y2="120"/>
    <line class="w" x1="306" y1="104" x2="354" y2="104"/>
    <line class="w" x1="306" y1="88" x2="354" y2="88"/>
    <line class="w" x1="306" y1="72" x2="354" y2="72"/>
  </g>
  <text x="372" y="100">discrete slots light up</text>
  <text x="372" y="118">per-slot energy stays</text>

  <!-- liquid -->
  <text class="lbl" x="300" y="212">Liquid Fill</text>
  <rect class="bx" x="300" y="224" width="60" height="90" rx="8"/>
  <rect x="304" y="268" width="52" height="42" fill="hsl(var(--accent))" opacity="0.35"/>
  <g fill="hsl(var(--accent))">
    <circle cx="314" cy="278" r="2"/><circle cx="330" cy="274" r="1.6"/><circle cx="345" cy="282" r="2.2"/>
    <circle cx="320" cy="292" r="1.8"/><circle cx="338" cy="296" r="2"/><circle cx="350" cy="302" r="1.6"/>
    <circle cx="308" cy="304" r="1.8"/><circle cx="328" cy="306" r="1.6"/>
  </g>
  <line class="w" x1="304" y1="268" x2="356" y2="268"/>
  <text x="372" y="272">one continuous level</text>
  <text x="372" y="290">energy field clipped to the fill</text>
  <text x="372" y="308">score plate reads 100 / 400</text>
</svg>
