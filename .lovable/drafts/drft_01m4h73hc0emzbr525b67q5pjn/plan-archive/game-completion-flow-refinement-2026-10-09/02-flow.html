<!doctype html>
<html><body><svg viewBox="0 0 640 310" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Completion Flow behavior and controls">
<style>
text{font-family:var(--font-sans);fill:var(--fg-primary)}.small{font-size:12px;fill:var(--fg-secondary)}.label{font-size:14px;font-weight:480}.box{fill:none;stroke:var(--fg-secondary);stroke-width:1}.surface{fill:var(--bg-muted);stroke:var(--border-translucent);stroke-width:1}.accent{fill:var(--bg-accent-translucent);stroke:var(--fg-accent);stroke-width:1}.wire{fill:none;stroke:var(--fg-secondary);stroke-width:1}.dash{stroke-dasharray:4 3}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--fg-secondary)"/></marker></defs>
<rect x="18" y="18" width="604" height="274" rx="8" class="surface"/>
<rect x="42" y="40" width="556" height="154" rx="8" class="box"/>
<text x="58" y="62" class="small">completion screen</text>
<rect x="68" y="78" width="156" height="88" rx="8" class="accent"/>
<text x="146" y="115" text-anchor="middle" class="label">Flow character</text>
<text x="146" y="136" text-anchor="middle" class="small">Base loops continuously</text>
<rect x="268" y="76" width="294" height="92" rx="8" class="box"/>
<text x="415" y="115" text-anchor="middle" class="label">Completion panel</text>
<text x="415" y="136" text-anchor="middle" class="small">stars · rewards · Continue · Exit</text>
<rect x="66" y="208" width="214" height="50" rx="25" class="accent"/>
<text x="173" y="229" text-anchor="middle" class="label">Emotion buttons</text>
<text x="173" y="246" text-anchor="middle" class="small">creator moves/resizes · students tap</text>
<path d="M280 232 C326 232 326 172 258 140" class="wire" marker-end="url(#arrow)"/>
<text x="326" y="213" class="small">tap reaction</text>
<path d="M224 104 C252 74 252 62 186 62" class="wire dash" marker-end="url(#arrow)"/>
<text x="240" y="54" class="small">reaction ends → Base resumes</text>
<circle cx="52" cy="214" r="12" fill="var(--bg-accent)"/><text x="52" y="219" text-anchor="middle" style="font:12px var(--font-sans);fill:var(--fg-emphasis)">1</text>
<text x="298" y="275" class="small">Character and emotion strip save separate Game-only placement.</text>
</svg></body></html>
