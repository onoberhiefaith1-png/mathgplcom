<!doctype html>
<html><body><svg viewBox="0 0 640 350" width="100%" role="img" aria-label="Visual state flowing from Canvas editing to Lesson Notes and Smartboard">
<style>
text{font-family:var(--font-sans);fill:var(--fg-primary)} .small{font-size:12px;fill:var(--fg-secondary)} .label{font-size:14px;font-weight:480}.box{fill:none;stroke:var(--fg-secondary);stroke-width:1}.zone{fill:none;stroke:var(--border-translucent);stroke-dasharray:4 3}.quiet{fill:var(--bg-muted)}.accent{fill:var(--bg-accent-translucent);stroke:var(--fg-accent)}.wire{stroke:var(--fg-secondary);stroke-width:1;fill:none}.rail{stroke:var(--border-translucent);stroke-width:1}.halo{paint-order:stroke;stroke:var(--bg-primary);stroke-width:5px;stroke-linejoin:round}
</style>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="none" stroke="var(--fg-secondary)"/></marker></defs>
<rect x="18" y="28" width="184" height="286" rx="8" class="zone"/><text x="30" y="49" class="small">canvas / edit</text>
<rect x="34" y="69" width="152" height="86" rx="5" class="box"/><rect x="34" y="69" width="152" height="86" rx="5" class="accent"/><text x="110" y="107" text-anchor="middle" class="label">Saved 16:9 scene</text><text x="110" y="126" text-anchor="middle" class="small">position · size · zoom</text>
<text x="34" y="183" class="small">Fixed viewport</text><text x="34" y="202" class="small">Media may fill or exceed frame</text><text x="34" y="221" class="small">Current editor stays unchanged</text>
<path d="M202 112H250" class="wire" marker-end="url(#arrow)"/><text x="226" y="99" text-anchor="middle" class="small halo">save</text>
<rect x="252" y="28" width="166" height="286" rx="8" class="zone"/><text x="264" y="49" class="small">lesson note</text>
<rect x="269" y="69" width="132" height="18" rx="3" class="quiet"/><rect x="269" y="99" width="132" height="74" rx="5" class="box"/><text x="335" y="138" text-anchor="middle" class="label">Whole Canvas</text>
<rect x="269" y="190" width="132" height="18" rx="3" class="quiet"/><rect x="269" y="220" width="132" height="18" rx="3" class="quiet"/><path d="M262 178H408" class="rail"/><text x="335" y="274" text-anchor="middle" class="small">Uniform zoom grows the box</text><text x="335" y="293" text-anchor="middle" class="small">and pushes these lines down</text>
<path d="M418 112H466" class="wire" marker-end="url(#arrow)"/><text x="442" y="99" text-anchor="middle" class="small halo">inherit</text>
<rect x="468" y="28" width="154" height="286" rx="8" class="zone"/><text x="480" y="49" class="small">smartboard</text>
<rect x="485" y="69" width="120" height="68" rx="5" class="box"/><text x="545" y="100" text-anchor="middle" class="label">Same initial view</text><text x="545" y="119" text-anchor="middle" class="small">exact saved frame</text>
<path d="M485 157H605" class="rail"/><rect x="485" y="171" width="120" height="18" rx="3" class="quiet"/><rect x="485" y="203" width="120" height="18" rx="3" class="quiet"/><text x="545" y="257" text-anchor="middle" class="small">Board-only drag + zoom</text><text x="545" y="276" text-anchor="middle" class="small">reflows later teaching rows</text><text x="545" y="295" text-anchor="middle" class="small">without changing the note</text>
</svg></body></html>
