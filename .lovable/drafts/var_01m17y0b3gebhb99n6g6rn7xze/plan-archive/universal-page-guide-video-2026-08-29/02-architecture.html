<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" style="font-family: var(--font-sans)">
  <style>
    .lbl { fill: hsl(var(--foreground)); font-size: 14px; font-weight: 480; }
    .sm  { fill: hsl(var(--muted-foreground)); font-size: 12px; }
    .mono{ fill: hsl(var(--muted-foreground)); font-size: 12px; font-family: var(--font-mono); }
    .bx  { fill: none; stroke: hsl(var(--muted-foreground)); stroke-width: 1; }
    .zn  { fill: none; stroke: hsl(var(--border)); stroke-width: 1; stroke-dasharray: 4 3; }
    .qf  { fill: hsl(var(--muted)); }
    .gb  { fill: hsl(var(--border)); }
    .w   { stroke: hsl(var(--muted-foreground)); stroke-width: 1; fill: none; }
    .acc { fill: none; stroke: hsl(var(--accent)); stroke-width: 1; }
    .accf{ fill: hsl(var(--accent)); }
    .acct{ fill: hsl(var(--accent-foreground)); font-size: 12px; font-weight: 480; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 1 L7 4 L0 7" fill="none" stroke="hsl(var(--muted-foreground))" stroke-width="1"/>
    </marker>
  </defs>

  <!-- default state -->
  <text x="8" y="14" class="sm">default — page only</text>
  <rect x="8" y="24" width="180" height="120" rx="8" class="bx"/>
  <rect x="20" y="36" width="70" height="8" rx="4" class="gb"/>
  <rect x="112" y="32" width="62" height="16" rx="8" class="acc"/>
  <text x="143" y="43" text-anchor="middle" class="mono" style="fill: hsl(var(--accent))">▶ Guide</text>
  <rect x="20" y="60" width="156" height="8" rx="4" class="gb"/>
  <rect x="20" y="76" width="140" height="8" rx="4" class="gb"/>
  <rect x="20" y="92" width="150" height="8" rx="4" class="gb"/>
  <rect x="20" y="112" width="60" height="18" rx="8" class="qf"/>

  <!-- arrow -->
  <line x1="196" y1="84" x2="236" y2="84" class="w" marker-end="url(#a)"/>
  <text x="216" y="76" text-anchor="middle" class="sm" style="paint-order: stroke; stroke: hsl(var(--background)); stroke-width: 3px">click</text>

  <!-- split state -->
  <text x="244" y="14" class="sm">split — watch and work at the same time</text>
  <rect x="244" y="24" width="388" height="120" rx="8" class="bx"/>
  <line x1="438" y1="24" x2="438" y2="144" stroke="hsl(var(--border))" stroke-width="1"/>
  <text x="256" y="42" class="sm">live page (still interactive)</text>
  <rect x="256" y="52" width="160" height="8" rx="4" class="gb"/>
  <rect x="256" y="68" width="140" height="8" rx="4" class="gb"/>
  <rect x="256" y="112" width="70" height="18" rx="8" class="qf"/>
  <text x="291" y="125" text-anchor="middle" class="sm">Create</text>

  <rect x="450" y="40" width="170" height="70" rx="8" class="qf"/>
  <path d="M527 66 L543 75 L527 84 Z" class="accf"/>
  <rect x="450" y="116" width="120" height="6" rx="3" class="gb"/>
  <text x="620" y="34" text-anchor="end" class="sm">× close</text>

  <!-- data chain -->
  <rect x="8" y="176" width="624" height="140" rx="8" class="zn"/>
  <text x="20" y="196" class="sm">one configuration, many pages</text>

  <rect x="24" y="210" width="120" height="46" rx="8" class="bx"/>
  <text x="84" y="230" text-anchor="middle" class="lbl">Page</text>
  <text x="84" y="246" text-anchor="middle" class="mono">/teaching-hub</text>

  <line x1="148" y1="233" x2="184" y2="233" class="w" marker-end="url(#a)"/>

  <rect x="188" y="210" width="140" height="46" rx="8" class="bx"/>
  <text x="258" y="230" text-anchor="middle" class="lbl">Guide record</text>
  <text x="258" y="246" text-anchor="middle" class="sm">title · status · video</text>

  <line x1="332" y1="233" x2="368" y2="233" class="w" marker-end="url(#a)"/>

  <rect x="372" y="210" width="120" height="46" rx="8" class="bx"/>
  <text x="432" y="230" text-anchor="middle" class="lbl">Stored video</text>
  <text x="432" y="246" text-anchor="middle" class="sm">stored once</text>

  <line x1="496" y1="233" x2="532" y2="233" class="w" marker-end="url(#a)"/>

  <rect x="536" y="204" width="84" height="58" rx="8" class="acc"/>
  <text x="578" y="228" text-anchor="middle" class="lbl">Split</text>
  <text x="578" y="244" text-anchor="middle" class="lbl">frame</text>

  <text x="24" y="288" class="sm">new page later = one guide record, no new player and no new layout code</text>
  <circle cx="30" cy="302" r="8" class="accf"/>
  <text x="30" y="306" text-anchor="middle" class="acct">1</text>
  <text x="46" y="306" class="sm">the reusable frame is the shared piece — every page mounts the same one</text>
</svg>
