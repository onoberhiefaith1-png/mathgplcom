    .wire{fill:none;stroke:var(--fg-secondary);stroke-width:1;marker-end:url(#arrow)}

  <text class="label" x="402" y="282" text-anchor="middle">Calculator</text>
  <text class="note" x="402" y="300" text-anchor="middle">collector projectile</text>

  <rect class="box" x="40" y="321" width="240" height="34" rx="17" stroke-dasharray="4 3"/>
  <text class="note" x="160" y="343" text-anchor="middle">never target: Hourglass · Completion</text>
