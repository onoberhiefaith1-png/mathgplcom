<!doctype html>
<html><body>
<svg viewBox="0 0 640 300" role="img" aria-label="Three independent teacher controls feed the matching device rendering, with text and surface scaling together" style="width:100%;font-family:var(--font-sans);">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="var(--fg-secondary)"/></marker>
  </defs>
  <rect x="20" y="32" width="180" height="224" rx="8" fill="var(--bg-secondary)" stroke="var(--fg-secondary)"/>
  <text x="110" y="58" text-anchor="middle" fill="var(--fg-primary)" font-size="14" font-weight="480">Imagine settings</text>
  <text x="38" y="94" fill="var(--fg-primary)" font-size="12">Desktop</text>
  <line x1="38" y1="110" x2="180" y2="110" stroke="var(--border-translucent)"/>
  <circle cx="109" cy="110" r="7" fill="var(--bg-accent)" stroke="var(--fg-emphasis)"/>
  <text x="38" y="148" fill="var(--fg-primary)" font-size="12">Tablet</text>
  <line x1="38" y1="164" x2="180" y2="164" stroke="var(--border-translucent)"/>
  <circle cx="109" cy="164" r="7" fill="var(--bg-accent)" stroke="var(--fg-emphasis)"/>
  <text x="38" y="202" fill="var(--fg-primary)" font-size="12">Mobile</text>
  <line x1="38" y1="218" x2="180" y2="218" stroke="var(--border-translucent)"/>
  <circle cx="109" cy="218" r="7" fill="var(--bg-accent)" stroke="var(--fg-emphasis)"/>
  <text x="109" y="241" text-anchor="middle" fill="var(--fg-secondary)" font-size="12">current minimum = midpoint</text>

  <line x1="202" y1="144" x2="280" y2="144" stroke="var(--fg-secondary)" marker-end="url(#arrow)"/>
  <text x="241" y="132" text-anchor="middle" fill="var(--fg-secondary)" font-size="12" style="paint-order:stroke;stroke:var(--bg-primary);stroke-width:4px">device match</text>

  <rect x="282" y="76" width="146" height="136" rx="8" fill="var(--bg-tertiary)" stroke="var(--fg-secondary)"/>
  <text x="355" y="101" text-anchor="middle" fill="var(--fg-primary)" font-size="14" font-weight="480">Imagine stage</text>
  <rect x="302" y="122" width="106" height="56" rx="6" fill="var(--bg-muted)" stroke="var(--fg-secondary)"/>
  <text x="355" y="154" text-anchor="middle" fill="var(--fg-primary)" font-size="12">writing</text>
  <text x="355" y="197" text-anchor="middle" fill="var(--fg-secondary)" font-size="12">one active size</text>

  <line x1="430" y1="144" x2="506" y2="144" stroke="var(--fg-secondary)" marker-end="url(#arrow)"/>
  <rect x="508" y="86" width="112" height="116" rx="8" fill="var(--bg-accent-translucent)" stroke="var(--fg-accent)"/>
  <text x="564" y="120" text-anchor="middle" fill="var(--fg-accent)" font-size="14" font-weight="480">Scale together</text>
  <text x="564" y="148" text-anchor="middle" fill="var(--fg-primary)" font-size="12">text</text>
  <text x="564" y="169" text-anchor="middle" fill="var(--fg-primary)" font-size="12">surface</text>
  <text x="564" y="190" text-anchor="middle" fill="var(--fg-primary)" font-size="12">spacing</text>
</svg>
</body></html>
