<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Imagine bomb and collector activation flow">
  <style>
    text{font-family:var(--font-sans);fill:var(--fg-primary);letter-spacing:0}

    .box{fill:none;stroke:var(--fg-secondary);stroke-width:1}.zone{fill:none;stroke:var(--border-translucent);stroke-width:1;stroke-dasharray:4 3}
    .muted{fill:var(--bg-muted);stroke:var(--border-translucent);stroke-width:1}.accent{fill:var(--bg-accent-translucent);stroke:var(--fg-accent);stroke-width:1}
    .wire{fill:none;stroke:var(--fg-secondary);stroke-width:1;marker-end:url(#arrow)}.awire{fill:none;stroke:var(--fg-accent);stroke-width:1.5;marker-end:url(#arrowA)}

  <circle cx="320" cy="313" r="22" fill="none" stroke="var(--fg-accent)" stroke-width="1"/>
  <circle cx="456" cy="313" r="22" fill="none" stroke="var(--fg-accent)" stroke-width="1"/>
</svg>
