<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" style="font-family: var(--font-sans)">
  <style>
    .lbl { fill: hsl(var(--foreground)); font-size: 14px; font-weight: 480; }
    .note { fill: hsl(var(--muted-foreground)); font-size: 12px; }
    .bx { fill: none; stroke: hsl(var(--muted-foreground)); stroke-width: 1; }
    .rail { stroke: hsl(var(--border)); stroke-width: 1; }
    .quiet { fill: hsl(var(--muted)); }
    .greek { fill: hsl(var(--border)); }
  </style>

  <text class="note" x="8" y="14">now — menu floats over the workspace</text>
  <rect class="bx" x="8" y="24" width="290" height="120" rx="8"/>
  <rect class="quiet" x="8" y="24" width="290" height="120" rx="8" opacity="0.55"/>
  <rect x="8" y="24" width="120" height="120" rx="8" fill="hsl(var(--card))" stroke="hsl(var(--muted-foreground))" stroke-width="1"/>
  <rect class="greek" x="22" y="44" width="80" height="8" rx="4"/>
  <rect class="greek" x="22" y="62" width="66" height="8" rx="4"/>
  <rect class="greek" x="22" y="80" width="74" height="8" rx="4"/>
  <text class="note" x="150" y="90">dimmed / blurred</text>

  <text class="note" x="342" y="14">after — one screen, two panes</text>
  <rect class="bx" x="342" y="24" width="290" height="120" rx="8"/>
  <line class="rail" x1="452" y1="24" x2="452" y2="144"/>
  <rect class="greek" x="356" y="44" width="80" height="8" rx="4"/>
  <rect x="356" y="60" width="80" height="12" rx="6" fill="hsl(var(--accent))"/>
  <rect class="greek" x="356" y="82" width="70" height="8" rx="4"/>
  <rect class="greek" x="356" y="98" width="76" height="8" rx="4"/>
  <text class="lbl" x="468" y="52">My Classes</text>
  <rect class="greek" x="468" y="66" width="140" height="8" rx="4"/>
  <rect class="greek" x="468" y="82" width="120" height="8" rx="4"/>
  <rect class="greek" x="468" y="98" width="150" height="8" rx="4"/>

  <rect class="bx" x="342" y="152" width="290" height="26" rx="8"/>
  <text class="note" x="352" y="169">Learning · Connections · Courses · Overall View — pinned</text>

  <circle cx="20" cy="212" r="9" fill="hsl(var(--accent))"/>
  <text x="20" y="216" text-anchor="middle" font-size="11" fill="hsl(var(--accent-foreground))">1</text>
  <text class="note" x="38" y="216">The dark blurred sheet behind the menu is removed entirely.</text>
  <circle cx="20" cy="240" r="9" fill="none" stroke="hsl(var(--muted-foreground))"/>
  <text x="20" y="244" text-anchor="middle" font-size="11" fill="hsl(var(--muted-foreground))">2</text>
  <text class="note" x="38" y="244">Choosing an item changes only the right pane; the shell stays put.</text>
  <circle cx="20" cy="268" r="9" fill="none" stroke="hsl(var(--muted-foreground))"/>
  <text x="20" y="272" text-anchor="middle" font-size="11" fill="hsl(var(--muted-foreground))">3</text>
  <text class="note" x="38" y="272">Phones keep a slide-in panel with a plain dimmer, never a blur.</text>
</svg>
