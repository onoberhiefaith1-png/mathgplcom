<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-label="Student workspace: left list, content beside it, fixed bottom bar">
  <style>
    .t { font-family: var(--font-sans); fill: hsl(var(--foreground)); font-size: 12px; }
    .lbl { font-family: var(--font-sans); fill: hsl(var(--foreground)); font-size: 14px; font-weight: 480; }
    .m { font-family: var(--font-sans); fill: hsl(var(--muted-foreground)); font-size: 12px; }
    .bx { fill: none; stroke: hsl(var(--muted-foreground)); stroke-width: 1; }
    .zone { fill: none; stroke: hsl(var(--border)); stroke-width: 1; stroke-dasharray: 4 3; }
    .bar { fill: hsl(var(--muted)); stroke: hsl(var(--border)); stroke-width: 1; }
    .wire { stroke: hsl(var(--muted-foreground)); stroke-width: 1; fill: none; }
  </style>
  <defs>
    <marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6" fill="none" stroke="hsl(var(--muted-foreground))" stroke-width="1"/>
    </marker>
  </defs>

  <rect class="zone" x="8" y="8" width="624" height="314" rx="8"/>
  <text class="m" x="18" y="26">student workspace — one page</text>

  <!-- left list -->
  <rect class="bx" x="24" y="40" width="150" height="212" rx="8"/>
  <text class="lbl" x="36" y="60">☰ Navigation</text>
  <rect class="bar" x="36" y="72" width="126" height="10" rx="5"/>
  <rect class="bar" x="36" y="88" width="126" height="10" rx="5"/>
  <rect class="bar" x="36" y="104" width="126" height="10" rx="5"/>
  <rect class="bar" x="36" y="120" width="126" height="10" rx="5"/>
  <rect class="bar" x="36" y="136" width="126" height="10" rx="5"/>
  <rect class="bar" x="36" y="152" width="126" height="10" rx="5"/>
  <rect class="bar" x="36" y="168" width="126" height="10" rx="5"/>
  <text class="m" x="36" y="200">stays open until</text>
  <text class="m" x="36" y="216">the student closes it</text>

  <!-- content -->
  <rect class="bx" x="196" y="40" width="420" height="212" rx="8"/>
  <text class="lbl" x="210" y="60">Selected content opens here</text>
  <text class="m" x="210" y="80">Classes · Assignments · Adventure · Courses · Schools ·</text>
  <text class="m" x="210" y="98">Teachers · Requests · Account · Go Live</text>
  <rect class="bar" x="210" y="112" width="390" height="12" rx="6"/>
  <rect class="bar" x="210" y="132" width="330" height="12" rx="6"/>
  <rect class="bar" x="210" y="152" width="360" height="12" rx="6"/>
  <text class="m" x="210" y="192">Building and MathGPL Community leave this page instead</text>

  <path class="wire" d="M176 130 L192 130" marker-end="url(#a)"/>

  <!-- fixed bar -->
  <rect x="24" y="268" width="592" height="40" rx="8" fill="hsl(var(--accent))" stroke="hsl(var(--accent))"/>
  <text class="lbl" x="60" y="293" style="fill: hsl(var(--accent-foreground))">Learning</text>
  <text class="lbl" x="200" y="293" style="fill: hsl(var(--accent-foreground))">Connections</text>
  <text class="lbl" x="360" y="293" style="fill: hsl(var(--accent-foreground))">Courses</text>
  <text class="lbl" x="490" y="293" style="fill: hsl(var(--accent-foreground))">Overall View</text>
  <text class="m" x="24" y="264">pinned to the screen — never scrolls, never hidden</text>
</svg>
