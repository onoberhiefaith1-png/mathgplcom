<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" style="font-family: var(--font-sans)">
  <style>
    .lbl { font-size: 14px; font-weight: 480; fill: hsl(var(--foreground)); }
    .note { font-size: 12px; fill: hsl(var(--muted-foreground)); }
    .tag { font-size: 12px; fill: hsl(var(--border)); }
    .bx { fill: none; stroke: hsl(var(--muted-foreground)); stroke-width: 1; }
    .rail { stroke: hsl(var(--border)); stroke-width: 1; }
    .q { fill: hsl(var(--muted)); }
  </style>

  <!-- page only -->
  <text class="note" x="12" y="16">page only</text>
  <rect class="bx" x="12" y="26" width="180" height="120" rx="8"/>
  <rect class="q" x="26" y="42" width="90" height="8" rx="4"/>
  <rect class="q" x="26" y="62" width="130" height="8" rx="4"/>
  <rect class="q" x="26" y="78" width="110" height="8" rx="4"/>
  <circle cx="176" cy="42" r="9" fill="hsl(var(--accent))"/>
  <path d="M173 38 l7 4 -7 4 z" fill="hsl(var(--accent-foreground))"/>
  <text class="note" x="12" y="164">tutorial icon, top-right, offset where busy</text>

  <!-- split -->
  <text class="note" x="228" y="16">split view</text>
  <rect class="bx" x="228" y="26" width="180" height="120" rx="8"/>
  <line class="rail" x1="330" y1="26" x2="330" y2="146"/>
  <rect class="q" x="242" y="42" width="70" height="8" rx="4"/>
  <rect class="q" x="242" y="62" width="80" height="8" rx="4"/>
  <rect x="340" y="42" width="58" height="34" rx="6" fill="hsl(var(--accent))" opacity="0.25"/>
  <rect class="bx" x="340" y="42" width="58" height="34" rx="6"/>
  <path d="M362 53 l10 6 -10 6 z" fill="hsl(var(--accent))"/>
  <line class="rail" x1="340" y1="86" x2="398" y2="86"/>
  <text class="tag" x="340" y="100">1x 2x 3x</text>
  <text class="note" x="228" y="164">page stays interactive; video keeps its position</text>

  <!-- video only -->
  <text class="note" x="444" y="16">video only</text>
  <rect class="bx" x="444" y="26" width="184" height="120" rx="8"/>
  <rect x="458" y="40" width="156" height="70" rx="6" fill="hsl(var(--muted))"/>
  <path d="M528 66 l14 9 -14 9 z" fill="hsl(var(--accent))"/>
  <line class="rail" x1="458" y1="120" x2="614" y2="120"/>
  <text class="tag" x="458" y="136">timeline · volume · speed</text>
  <text class="note" x="444" y="164">page never unmounts behind it</text>

  <!-- persistence rail -->
  <rect x="12" y="196" width="616" height="80" rx="8" fill="none" stroke="hsl(var(--border))" stroke-width="1" stroke-dasharray="4 3"/>
  <text class="tag" x="24" y="214">app-level player · one instance</text>
  <line class="rail" x1="60" y1="252" x2="580" y2="252"/>
  <g>
    <circle cx="90" cy="252" r="4" fill="hsl(var(--muted-foreground))"/>
    <text class="lbl" x="70" y="242">Lesson Notes</text>
    <circle cx="280" cy="252" r="4" fill="hsl(var(--muted-foreground))"/>
    <text class="lbl" x="248" y="242">Smartboard</text>
    <circle cx="470" cy="252" r="4" fill="hsl(var(--muted-foreground))"/>
    <text class="lbl" x="448" y="242">Classes</text>
  </g>
  <text class="note" x="60" y="270">playback continues across every navigation — no reload, no rewind</text>
</svg>
