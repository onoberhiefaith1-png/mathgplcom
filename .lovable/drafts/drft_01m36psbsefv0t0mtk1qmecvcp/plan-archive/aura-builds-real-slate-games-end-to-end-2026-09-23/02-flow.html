<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Draft to test to approve to publish flow">
  <style>
    text { font-family: var(--font-sans); fill: var(--fg-primary); }
    .lbl { font-size: 13px; font-weight: 480; }
    .note { font-size: 11px; fill: var(--fg-secondary); }
    .tag { font-size: 10px; fill: var(--fg-secondary); letter-spacing: .06em; }
    .box { fill: none; stroke: var(--fg-secondary); stroke-width: 1; }
    .zone { fill: none; stroke: var(--border-translucent); stroke-width: 1; stroke-dasharray: 4 3; }
    .wire { stroke: var(--fg-secondary); stroke-width: 1; fill: none; }
    .accent { fill: var(--bg-accent-translucent); stroke: var(--fg-accent); }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8" fill="none" stroke="var(--fg-secondary)" stroke-width="1"/>
    </marker>
  </defs>

  <rect class="zone" x="8" y="34" width="392" height="112" rx="8"/>
  <text class="tag" x="18" y="52">aura works freely here</text>

  <rect class="box" x="24" y="66" width="104" height="52" rx="8"/>
  <text class="lbl" x="76" y="88" text-anchor="middle">Lesson note</text>
  <text class="note" x="76" y="105" text-anchor="middle">sessions + questions</text>

  <rect class="box" x="156" y="66" width="104" height="52" rx="8"/>
  <text class="lbl" x="208" y="88" text-anchor="middle">Game draft</text>
  <text class="note" x="208" y="105" text-anchor="middle">rooms, rewards</text>

  <rect class="box accent" x="288" y="66" width="96" height="52" rx="8"/>
  <text class="lbl" x="336" y="88" text-anchor="middle">Media</text>
  <text class="note" x="336" y="105" text-anchor="middle">cost shown first</text>

  <rect class="box" x="24" y="196" width="104" height="52" rx="8"/>
  <text class="lbl" x="76" y="218" text-anchor="middle">Test class</text>
  <text class="note" x="76" y="235" text-anchor="middle">hidden, labelled</text>

  <rect class="box" x="188" y="196" width="120" height="52" rx="8"/>
  <text class="lbl" x="248" y="218" text-anchor="middle">Read back</text>
  <text class="note" x="248" y="235" text-anchor="middle">what actually saved</text>

  <rect class="box" x="368" y="196" width="112" height="52" rx="8"/>
  <text class="lbl" x="424" y="218" text-anchor="middle">Your approval</text>
  <text class="note" x="424" y="235" text-anchor="middle">shown in full</text>

  <rect class="box" x="516" y="196" width="104" height="52" rx="8"/>
  <text class="lbl" x="568" y="218" text-anchor="middle">Live for class</text>
  <text class="note" x="568" y="235" text-anchor="middle">verified, opened</text>

  <line class="wire" x1="128" y1="92" x2="152" y2="92" marker-end="url(#a)"/>
  <line class="wire" x1="260" y1="92" x2="284" y2="92" marker-end="url(#a)"/>
  <path class="wire" d="M336 118 L336 160 L76 160 L76 192" marker-end="url(#a)"/>
  <line class="wire" x1="128" y1="222" x2="184" y2="222" marker-end="url(#a)"/>
  <line class="wire" x1="308" y1="222" x2="364" y2="222" marker-end="url(#a)"/>
  <line class="wire" x1="480" y1="222" x2="512" y2="222" marker-end="url(#a)"/>

  <circle cx="440" cy="92" r="9" fill="var(--bg-accent-translucent)"/>
  <text x="440" y="96" text-anchor="middle" font-size="11" fill="var(--fg-accent)">1</text>
  <text class="note" x="456" y="88">Nothing reaches a real student</text>
  <text class="note" x="456" y="104">until the last two steps.</text>
</svg>
