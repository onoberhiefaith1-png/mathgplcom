<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" style="font-family: var(--font-sans)">
  <style>
    .lbl { font-size: 14px; font-weight: 480; fill: hsl(var(--foreground)); }
    .note { font-size: 12px; fill: hsl(var(--muted-foreground)); }
    .tag { font-size: 12px; fill: hsl(var(--border)); }
    .bx { fill: none; stroke: hsl(var(--muted-foreground)); stroke-width: 1; }
    .zn { fill: none; stroke: hsl(var(--border)); stroke-width: 1; stroke-dasharray: 4 3; }
    .wire { stroke: hsl(var(--muted-foreground)); stroke-width: 1; fill: none; }
    .acc { fill: none; stroke: hsl(var(--accent)); stroke-width: 1; }
  </style>
  <defs>
    <marker id="cv" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L7 4 L0 8" fill="none" stroke="hsl(var(--muted-foreground))" stroke-width="1"/>
    </marker>
  </defs>

  <rect class="bx" x="8" y="60" width="120" height="86" rx="8"/>
  <text class="lbl" x="68" y="92" text-anchor="middle">Sender</text>
  <text class="note" x="68" y="112" text-anchor="middle">role + audience</text>
  <text class="note" x="68" y="128" text-anchor="middle">+ category</text>

  <rect class="acc" x="176" y="40" width="152" height="126" rx="8"/>
  <text class="lbl" x="252" y="66" text-anchor="middle">Notification engine</text>
  <text class="note" x="252" y="88" text-anchor="middle">re-checks permission</text>
  <text class="note" x="252" y="106" text-anchor="middle">expands audience</text>
  <text class="note" x="252" y="124" text-anchor="middle">applies add / remove</text>
  <text class="note" x="252" y="142" text-anchor="middle">fans out recipients</text>

  <rect class="bx" x="380" y="24" width="120" height="52" rx="8"/>
  <text class="lbl" x="440" y="46" text-anchor="middle">Region / schools</text>
  <text class="note" x="440" y="64" text-anchor="middle">administrator only</text>
  <rect class="bx" x="380" y="88" width="120" height="52" rx="8"/>
  <text class="lbl" x="440" y="110" text-anchor="middle">Classes</text>
  <text class="note" x="440" y="128" text-anchor="middle">school + teacher</text>
  <rect class="bx" x="380" y="152" width="120" height="42" rx="8"/>
  <text class="lbl" x="440" y="178" text-anchor="middle">Individuals</text>

  <line class="wire" x1="128" y1="103" x2="172" y2="103" marker-end="url(#cv)"/>
  <line class="wire" x1="328" y1="80" x2="376" y2="50" marker-end="url(#cv)"/>
  <line class="wire" x1="328" y1="103" x2="376" y2="112" marker-end="url(#cv)"/>
  <line class="wire" x1="328" y1="126" x2="376" y2="170" marker-end="url(#cv)"/>

  <rect class="zn" x="8" y="200" width="492" height="88" rx="8"/>
  <text class="tag" x="20" y="218">recipient side</text>
  <rect class="bx" x="24" y="228" width="108" height="44" rx="8"/>
  <text class="lbl" x="78" y="255" text-anchor="middle">Bell + sound</text>
  <rect class="bx" x="152" y="228" width="108" height="44" rx="8"/>
  <text class="lbl" x="206" y="255" text-anchor="middle">Panel</text>
  <rect class="bx" x="280" y="228" width="108" height="44" rx="8"/>
  <text class="lbl" x="334" y="255" text-anchor="middle">Centre</text>
  <rect class="bx" x="408" y="228" width="80" height="44" rx="8"/>
  <text class="lbl" x="448" y="255" text-anchor="middle">Response</text>
  <line class="wire" x1="132" y1="250" x2="148" y2="250" marker-end="url(#cv)"/>
  <line class="wire" x1="260" y1="250" x2="276" y2="250" marker-end="url(#cv)"/>
  <line class="wire" x1="388" y1="250" x2="404" y2="250" marker-end="url(#cv)"/>
  <line class="wire" x1="252" y1="166" x2="252" y2="224" marker-end="url(#cv)"/>

  <circle cx="524" cy="112" r="10" fill="hsl(var(--accent))"/>
  <text x="524" y="116" text-anchor="middle" style="font-size:12px; fill:hsl(var(--accent-foreground))">1</text>
  <text class="note" x="542" y="105">Engine is the only</text>
  <text class="note" x="542" y="121">place permission is</text>
  <text class="note" x="542" y="137">decided — the UI</text>
  <text class="note" x="542" y="153">never grants reach.</text>

  <circle cx="524" cy="250" r="10" fill="hsl(var(--accent))"/>
  <text x="524" y="254" text-anchor="middle" style="font-size:12px; fill:hsl(var(--accent-foreground))">2</text>
  <text class="note" x="542" y="246">Response only</text>
  <text class="note" x="542" y="262">when the sender</text>
  <text class="note" x="542" y="278">allowed it.</text>
</svg>
