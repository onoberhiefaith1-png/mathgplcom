<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" style="font-family: var(--font-sans)">
  <style>
    .lbl { font-size: 14px; font-weight: 480; fill: hsl(var(--foreground)); }
    .sm  { font-size: 12px; fill: hsl(var(--muted-foreground)); }
    .mono{ font-size: 12px; font-family: var(--font-mono); fill: hsl(var(--foreground)); }
    .bx  { fill: none; stroke: hsl(var(--muted-foreground)); stroke-width: 1; }
    .wire{ stroke: hsl(var(--muted-foreground)); stroke-width: 1; fill: none; }
    .zone{ fill: none; stroke: hsl(var(--border)); stroke-width: 1; stroke-dasharray: 4 3; }
  </style>
  <defs>
    <marker id="ch" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1 L6 4 L1 7" fill="none" stroke="hsl(var(--muted-foreground))" stroke-width="1"/>
    </marker>
  </defs>

  <rect class="bx" x="10" y="20" width="150" height="54" rx="8"/>
  <text class="lbl" x="85" y="42" text-anchor="middle">student line</text>
  <text class="sm"  x="85" y="60" text-anchor="middle">expected line</text>

  <line class="wire" x1="160" y1="47" x2="212" y2="47" marker-end="url(#ch)"/>

  <rect class="bx" x="216" y="14" width="170" height="66" rx="8"/>
  <text class="lbl" x="301" y="38" text-anchor="middle">written the same way?</text>
  <text class="sm"  x="301" y="58" text-anchor="middle">cosmetics ignored</text>

  <line class="wire" x1="386" y1="47" x2="470" y2="47" marker-end="url(#ch)"/>
  <rect class="bx" x="474" y="24" width="150" height="46" rx="23" fill="hsl(var(--accent))" stroke="none"/>
  <text class="lbl" x="549" y="52" text-anchor="middle" style="fill: hsl(var(--accent-foreground))">marks awarded</text>

  <line class="wire" x1="301" y1="80" x2="301" y2="112" marker-end="url(#ch)"/>

  <rect class="zone" x="26" y="112" width="588" height="150" rx="8"/>
  <text class="sm" x="38" y="130">new gate</text>

  <rect class="bx" x="46" y="142" width="168" height="60" rx="8"/>
  <text class="lbl" x="130" y="166" text-anchor="middle">student's own sides</text>
  <text class="mono" x="130" y="186" text-anchor="middle">2 = 2 &#8594; rejected</text>

  <line class="wire" x1="214" y1="172" x2="248" y2="172" marker-end="url(#ch)"/>

  <rect class="bx" x="252" y="142" width="168" height="60" rx="8"/>
  <text class="lbl" x="336" y="166" text-anchor="middle">letters must match</text>
  <text class="mono" x="336" y="186" text-anchor="middle">y for an x line &#8594; no</text>

  <line class="wire" x1="420" y1="172" x2="454" y2="172" marker-end="url(#ch)"/>

  <rect class="bx" x="458" y="142" width="140" height="60" rx="8"/>
  <text class="lbl" x="528" y="166" text-anchor="middle">side by side</text>
  <text class="sm"  x="528" y="186" text-anchor="middle">left vs left, right vs right</text>

  <rect class="bx" x="46" y="216" width="552" height="34" rx="8"/>
  <text class="sm" x="322" y="238" text-anchor="middle">solving equations only: valid alternative steps still accepted by the leftover comparison</text>

  <line class="wire" x1="322" y1="262" x2="322" y2="288" marker-end="url(#ch)"/>
  <rect class="bx" x="232" y="292" width="180" height="34" rx="17"/>
  <text class="lbl" x="322" y="314" text-anchor="middle">not equivalent, 0 marks</text>
</svg>
