<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg">

    text { font-family: var(--font-sans); fill: hsl(var(--foreground)); }

  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 1 L6 4 L0 7" fill="none" stroke="hsl(var(--muted-foreground))" stroke-width="1"/>
    </marker>
  </defs>

  <rect class="bx" x="8" y="40" width="130" height="52" rx="8"/>
  <text class="lbl" x="73" y="62" text-anchor="middle">Structure</text>
  <text class="note" x="73" y="80" text-anchor="middle">1·1·4·0·6·10·0</text>

  <rect class="bx" x="162" y="40" width="130" height="52" rx="8"/>
  <text class="lbl" x="227" y="62" text-anchor="middle">Topic given</text>
  <text class="note" x="227" y="80" text-anchor="middle">completing square</text>

  <rect class="ac" x="316" y="40" width="150" height="52" rx="8"/>
  <text class="lbl" x="391" y="62" text-anchor="middle">Draft blueprint</text>
  <text class="note" x="391" y="80" text-anchor="middle">22 real questions</text>

  <rect class="bx" x="490" y="40" width="142" height="52" rx="8"/>

  <text class="note" x="561" y="80" text-anchor="middle">narrated, item by item</text>

  <line class="w" x1="138" y1="66" x2="158" y2="66" marker-end="url(#a)"/>
  <line class="w" x1="292" y1="66" x2="312" y2="66" marker-end="url(#a)"/>
  <line class="w" x1="466" y1="66" x2="486" y2="66" marker-end="url(#a)"/>

  <rect x="8" y="150" width="624" height="1" fill="hsl(var(--border))"/>

  <text class="note" x="38" y="220">Watch all 22 items finish — a stalled or truncated tail is the failure to catch.</text>

  <circle cx="20" cy="250" r="9" fill="hsl(var(--accent))"/>
  <text x="20" y="254" text-anchor="middle" font-size="11" fill="hsl(var(--accent-foreground))">3</text>
  <text class="note" x="38" y="254">Read the note: question quality, step-by-step solutions, rendering, question↔solution linkage.</text>
</svg>
