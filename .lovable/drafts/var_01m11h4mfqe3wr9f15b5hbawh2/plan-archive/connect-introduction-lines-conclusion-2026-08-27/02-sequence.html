<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" style="font-family: var(--font-sans)">
  <defs>
    <marker id="c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10" fill="none" stroke="hsl(var(--muted-foreground))" stroke-width="1.5"/>
    </marker>
  </defs>

  <text x="0" y="14" style="font-size:12px" fill="hsl(var(--muted-foreground))">student action</text>
  <line x1="0" y1="24" x2="640" y2="24" stroke="hsl(var(--border))" stroke-width="1"/>

  <rect x="0" y="36" width="120" height="40" rx="8" fill="none" stroke="hsl(var(--muted-foreground))"/>
  <text x="60" y="61" text-anchor="middle" style="font-size:14px;font-weight:480" fill="hsl(var(--foreground))">board opens</text>

  <rect x="170" y="36" width="120" height="40" rx="8" fill="none" stroke="hsl(var(--muted-foreground))"/>
  <text x="230" y="61" text-anchor="middle" style="font-size:14px;font-weight:480" fill="hsl(var(--foreground))">clicks #</text>

  <rect x="340" y="36" width="120" height="40" rx="8" fill="none" stroke="hsl(var(--muted-foreground))"/>
  <text x="400" y="55" text-anchor="middle" style="font-size:14px;font-weight:480" fill="hsl(var(--foreground))">Next / Present</text>
  <text x="400" y="70" text-anchor="middle" style="font-size:12px" fill="hsl(var(--muted-foreground))">line 2 … n</text>

  <rect x="500" y="36" width="140" height="40" rx="8" fill="none" stroke="hsl(var(--accent))"/>
  <text x="570" y="55" text-anchor="middle" style="font-size:14px;font-weight:480" fill="hsl(var(--accent-foreground))">final mark</text>
  <text x="570" y="70" text-anchor="middle" style="font-size:12px" fill="hsl(var(--muted-foreground))">awarded</text>

  <line x1="120" y1="56" x2="168" y2="56" stroke="hsl(var(--muted-foreground))" marker-end="url(#c)"/>
  <line x1="290" y1="56" x2="338" y2="56" stroke="hsl(var(--muted-foreground))" marker-end="url(#c)"/>
  <line x1="460" y1="56" x2="498" y2="56" stroke="hsl(var(--muted-foreground))" marker-end="url(#c)"/>

  <text x="0" y="120" style="font-size:12px" fill="hsl(var(--muted-foreground))">one video file, one playhead</text>
  <line x1="0" y1="130" x2="640" y2="130" stroke="hsl(var(--border))" stroke-width="1"/>

  <rect x="0" y="146" width="150" height="44" rx="8" fill="hsl(var(--muted))" stroke="hsl(var(--muted-foreground))"/>
  <text x="75" y="166" text-anchor="middle" style="font-size:14px;font-weight:480" fill="hsl(var(--foreground))">Introduction</text>
  <text x="75" y="181" text-anchor="middle" style="font-size:12px" fill="hsl(var(--muted-foreground))">optional · plays on open</text>

  <rect x="170" y="146" width="150" height="44" rx="8" fill="none" stroke="hsl(var(--muted-foreground))"/>
  <text x="245" y="166" text-anchor="middle" style="font-size:14px;font-weight:480" fill="hsl(var(--foreground))">Line 1 segment</text>
  <text x="245" y="181" text-anchor="middle" style="font-size:12px" fill="hsl(var(--muted-foreground))">stops at its own end</text>

  <rect x="340" y="146" width="150" height="44" rx="8" fill="none" stroke="hsl(var(--muted-foreground))"/>
  <text x="415" y="166" text-anchor="middle" style="font-size:14px;font-weight:480" fill="hsl(var(--foreground))">Line k segment</text>
  <text x="415" y="181" text-anchor="middle" style="font-size:12px" fill="hsl(var(--muted-foreground))">jump, never spill</text>

  <rect x="500" y="146" width="140" height="44" rx="8" fill="hsl(var(--accent))" stroke="hsl(var(--accent))"/>
  <text x="570" y="166" text-anchor="middle" style="font-size:14px;font-weight:480" fill="hsl(var(--accent-foreground))">Conclusion</text>
  <text x="570" y="181" text-anchor="middle" style="font-size:12px" fill="hsl(var(--accent-foreground))">optional · plays fully</text>

  <line x1="230" y1="80" x2="230" y2="144" stroke="hsl(var(--muted-foreground))" stroke-dasharray="4 3" marker-end="url(#c)"/>
  <line x1="400" y1="80" x2="400" y2="144" stroke="hsl(var(--muted-foreground))" stroke-dasharray="4 3" marker-end="url(#c)"/>
  <line x1="570" y1="80" x2="570" y2="144" stroke="hsl(var(--accent))" stroke-dasharray="4 3" marker-end="url(#c)"/>

  <circle cx="10" cy="228" r="9" fill="hsl(var(--accent))"/>
  <text x="10" y="232" text-anchor="middle" style="font-size:12px;font-weight:480" fill="hsl(var(--accent-foreground))">1</text>
  <text x="28" y="232" style="font-size:12px" fill="hsl(var(--muted-foreground))">Introduction keeps playing until the FIRST real line activation — not until the board renders.</text>

  <circle cx="10" cy="254" r="9" fill="hsl(var(--accent))"/>
  <text x="10" y="258" text-anchor="middle" style="font-size:12px;font-weight:480" fill="hsl(var(--accent-foreground))">2</text>
  <text x="28" y="258" style="font-size:12px" fill="hsl(var(--muted-foreground))">A segment ending never advances the line; only the student does.</text>

  <circle cx="10" cy="280" r="9" fill="hsl(var(--accent))"/>
  <text x="10" y="284" text-anchor="middle" style="font-size:12px;font-weight:480" fill="hsl(var(--accent-foreground))">3</text>
  <text x="28" y="284" style="font-size:12px" fill="hsl(var(--muted-foreground))">Conclusion fires on the awarded final mark, and plays to the end of the file.</text>
</svg>
