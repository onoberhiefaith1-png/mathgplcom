<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" style="font-family: var(--font-sans)">
  <defs>
    <marker id="chev" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1 L6 4 L1 7" fill="none" stroke="hsl(var(--muted-foreground))" stroke-width="1"/>
    </marker>
  </defs>

  <rect x="8" y="18" width="180" height="120" rx="8" fill="none" stroke="hsl(var(--border))" stroke-dasharray="4 3"/>
  <text x="18" y="34" style="font-size:12px" fill="hsl(var(--muted-foreground))">individual workspace</text>
  <rect x="24" y="46" width="148" height="34" rx="8" fill="none" stroke="hsl(var(--muted-foreground))"/>
  <text x="98" y="67" text-anchor="middle" style="font-size:14px;font-weight:480" fill="hsl(var(--foreground))">Create · own · edit</text>
  <rect x="24" y="90" width="148" height="34" rx="8" fill="none" stroke="hsl(var(--muted-foreground))"/>
  <text x="98" y="111" text-anchor="middle" style="font-size:14px;font-weight:480" fill="hsl(var(--foreground))">Profile editor</text>

  <line x1="192" y1="78" x2="238" y2="78" stroke="hsl(var(--muted-foreground))" marker-end="url(#chev)"/>
  <text x="215" y="70" text-anchor="middle" style="font-size:12px;paint-order:stroke;stroke:hsl(var(--background));stroke-width:3px" fill="hsl(var(--muted-foreground))">share</text>

  <rect x="244" y="18" width="180" height="120" rx="8" fill="none" stroke="hsl(var(--border))" stroke-dasharray="4 3"/>
  <text x="254" y="34" style="font-size:12px" fill="hsl(var(--muted-foreground))">community</text>
  <rect x="260" y="46" width="148" height="34" rx="8" fill="none" stroke="hsl(var(--muted-foreground))"/>
  <text x="334" y="67" text-anchor="middle" style="font-size:14px;font-weight:480" fill="hsl(var(--foreground))">Search · directory</text>
  <rect x="260" y="90" width="148" height="34" rx="8" fill="hsl(var(--accent))" stroke="hsl(var(--accent))"/>
  <text x="334" y="111" text-anchor="middle" style="font-size:14px;font-weight:480" fill="hsl(var(--accent-foreground))">Compact result card</text>

  <line x1="428" y1="107" x2="474" y2="107" stroke="hsl(var(--muted-foreground))" marker-end="url(#chev)"/>
  <text x="451" y="99" text-anchor="middle" style="font-size:12px;paint-order:stroke;stroke:hsl(var(--background));stroke-width:3px" fill="hsl(var(--muted-foreground))">view</text>

  <rect x="480" y="46" width="150" height="78" rx="8" fill="none" stroke="hsl(var(--muted-foreground))"/>
  <text x="555" y="80" text-anchor="middle" style="font-size:14px;font-weight:480" fill="hsl(var(--foreground))">Full profile</text>
  <text x="555" y="100" text-anchor="middle" style="font-size:12px" fill="hsl(var(--muted-foreground))">all public detail</text>

  <line x1="555" y1="130" x2="555" y2="176" stroke="hsl(var(--muted-foreground))" marker-end="url(#chev)"/>
  <rect x="480" y="182" width="150" height="52" rx="8" fill="none" stroke="hsl(var(--muted-foreground))"/>
  <text x="555" y="205" text-anchor="middle" style="font-size:14px;font-weight:480" fill="hsl(var(--foreground))">Shared content</text>
  <text x="555" y="223" text-anchor="middle" style="font-size:12px" fill="hsl(var(--muted-foreground))">original resource</text>

  <circle cx="24" cy="200" r="10" fill="hsl(var(--accent))"/>
  <text x="24" y="204" text-anchor="middle" style="font-size:12px" fill="hsl(var(--accent-foreground))">1</text>
  <text x="42" y="204" style="font-size:12px" fill="hsl(var(--muted-foreground))">Search results stay short: name, title, location, top qualification, subjects, views and likes.</text>
  <circle cx="24" cy="230" r="10" fill="hsl(var(--accent))"/>
  <text x="24" y="234" text-anchor="middle" style="font-size:12px" fill="hsl(var(--accent-foreground))">2</text>
  <text x="42" y="234" style="font-size:12px" fill="hsl(var(--muted-foreground))">Depth only after a click — the workspace still owns and edits every field.</text>
  <circle cx="24" cy="260" r="10" fill="hsl(var(--accent))"/>
  <text x="24" y="264" text-anchor="middle" style="font-size:12px" fill="hsl(var(--accent-foreground))">3</text>
  <text x="42" y="264" style="font-size:12px" fill="hsl(var(--muted-foreground))">Nothing is duplicated: Community links back to the original resource.</text>
</svg>
