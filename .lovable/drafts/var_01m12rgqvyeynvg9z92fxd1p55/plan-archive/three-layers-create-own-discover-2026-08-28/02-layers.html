<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Content flows from MathGPL to Personal Dashboard to Community, and a visitor arriving from Community sees the public view of that dashboard">
<style>
  text { font-family: var(--font-sans); fill: hsl(var(--foreground)); }
  .lbl { font-size: 14px; font-weight: 480; }
  .note { font-size: 12px; fill: hsl(var(--muted-foreground)); }
  .box { fill: none; stroke: hsl(var(--muted-foreground)); stroke-width: 1; }
  .zone { fill: none; stroke: hsl(var(--border)); stroke-width: 1; stroke-dasharray: 4 3; }
  .wire { stroke: hsl(var(--muted-foreground)); stroke-width: 1; fill: none; }
  .acc { fill: none; stroke: hsl(var(--accent)); stroke-width: 1; }
</style>
<defs>
  <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0 0 L8 4 L0 8" fill="none" stroke="hsl(var(--muted-foreground))" stroke-width="1"/>
  </marker>
</defs>

<rect class="box" x="16" y="60" width="160" height="72" rx="8"/>
<text class="lbl" x="96" y="90" text-anchor="middle">MathGPL</text>
<text class="note" x="96" y="110" text-anchor="middle">create · edit · manage</text>

<rect class="box" x="240" y="60" width="160" height="72" rx="8"/>
<text class="lbl" x="320" y="90" text-anchor="middle">Personal Dashboard</text>
<text class="note" x="320" y="110" text-anchor="middle">my content · owned</text>

<rect class="acc" x="464" y="60" width="160" height="72" rx="8"/>
<text class="lbl" x="544" y="90" text-anchor="middle">Community</text>
<text class="note" x="544" y="110" text-anchor="middle">search · discover</text>

<line class="wire" x1="180" y1="96" x2="234" y2="96" marker-end="url(#a)"/>
<text class="note" x="207" y="86" text-anchor="middle" style="paint-order:stroke;stroke:hsl(var(--background));stroke-width:3px">share</text>
<line class="wire" x1="404" y1="96" x2="458" y2="96" marker-end="url(#a)"/>
<text class="note" x="431" y="86" text-anchor="middle" style="paint-order:stroke;stroke:hsl(var(--background));stroke-width:3px">feeds</text>

<rect class="zone" x="240" y="180" width="384" height="92" rx="8"/>
<text class="note" x="252" y="200">visitor path</text>
<rect class="box" x="464" y="212" width="160" height="44" rx="8"/>
<text class="lbl" x="544" y="239" text-anchor="middle">ranked result card</text>
<rect class="box" x="256" y="212" width="160" height="44" rx="8"/>
<text class="lbl" x="336" y="239" text-anchor="middle">public dashboard</text>
<line class="wire" x1="460" y1="234" x2="422" y2="234" marker-end="url(#a)"/>
<line class="wire" x1="544" y1="136" x2="544" y2="208" marker-end="url(#a)"/>
<text class="note" x="336" y="288" text-anchor="middle">read-only · Copy to My MathGPL</text>
</svg>
