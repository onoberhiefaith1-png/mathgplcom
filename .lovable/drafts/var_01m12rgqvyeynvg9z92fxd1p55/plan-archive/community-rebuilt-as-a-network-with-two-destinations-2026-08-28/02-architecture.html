<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Rotating building leads to two Community destinations, fed by workspace sharing">
  <style>
    text { font-family: var(--font-sans); fill: hsl(var(--foreground)); }
    .lbl { font-size: 14px; font-weight: 480; }
    .sm { font-size: 12px; fill: hsl(var(--muted-foreground)); }
    .box { fill: none; stroke: hsl(var(--muted-foreground)); stroke-width: 1; }
    .zone { fill: none; stroke: hsl(var(--border)); stroke-width: 1; stroke-dasharray: 4 3; }
    .wire { stroke: hsl(var(--muted-foreground)); stroke-width: 1; fill: none; }
    .acc { fill: none; stroke: hsl(var(--accent)); stroke-width: 1; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1 L6 4 L1 7" fill="none" stroke="hsl(var(--muted-foreground))" stroke-width="1"/>
    </marker>
  </defs>

  <rect class="box" x="16" y="24" width="170" height="64" rx="8"/>
  <text class="lbl" x="101" y="50" text-anchor="middle">MyGPL Workspace</text>
  <text class="sm" x="101" y="70" text-anchor="middle">create notes, courses, live</text>

  <rect class="acc" x="16" y="128" width="170" height="52" rx="8"/>
  <text class="lbl" x="101" y="150" text-anchor="middle">Share to Community</text>
  <text class="sm" x="101" y="168" text-anchor="middle">explicit, per item</text>
  <line class="wire" x1="101" y1="88" x2="101" y2="126" marker-end="url(#a)"/>

  <rect class="box" x="240" y="72" width="150" height="60" rx="8"/>
  <text class="lbl" x="315" y="97" text-anchor="middle">Rotating Building</text>
  <text class="sm" x="315" y="115" text-anchor="middle">the entrance</text>

  <rect class="zone" x="424" y="16" width="200" height="164" rx="8"/>
  <text class="sm" x="434" y="34">dashboard</text>
  <rect class="box" x="440" y="44" width="168" height="120" rx="8"/>
  <text class="lbl" x="524" y="70" text-anchor="middle">My Community Space</text>
  <text class="sm" x="524" y="92" text-anchor="middle">profile · media · experience</text>
  <text class="sm" x="524" y="110" text-anchor="middle">my shared content</text>
  <text class="sm" x="524" y="128" text-anchor="middle">my posts · my activity</text>
  <text class="sm" x="524" y="150" text-anchor="middle">owner-only editing</text>

  <rect class="zone" x="424" y="204" width="200" height="180" rx="8"/>
  <text class="sm" x="434" y="222">community</text>
  <rect class="box" x="440" y="232" width="168" height="136" rx="8"/>
  <text class="lbl" x="524" y="258" text-anchor="middle">The MathGPL Network</text>
  <text class="sm" x="524" y="280" text-anchor="middle">teachers · schools</text>
  <text class="sm" x="524" y="298" text-anchor="middle">students · parents</text>
  <text class="sm" x="524" y="316" text-anchor="middle">live now · feed · posts</text>
  <text class="sm" x="524" y="334" text-anchor="middle">notes · courses · adventures</text>
  <text class="sm" x="524" y="354" text-anchor="middle">search · requests</text>

  <path class="wire" d="M390 96 C410 96 412 104 424 104" marker-end="url(#a)"/>
  <path class="wire" d="M390 108 C410 108 412 292 424 292" marker-end="url(#a)"/>
  <path class="wire" d="M186 154 C300 154 300 120 240 108" marker-end="url(#a)"/>
</svg>
