<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: var(--font-sans); fill: hsl(var(--foreground)); }
    .lbl { font-size: 14px; font-weight: 480; }
    .note { font-size: 12px; fill: hsl(var(--muted-foreground)); }
    .box { fill: none; stroke: hsl(var(--muted-foreground)); stroke-width: 1; }
    .wire { stroke: hsl(var(--muted-foreground)); stroke-width: 1; fill: none; }
    .zone { fill: none; stroke: hsl(var(--border)); stroke-width: 1; stroke-dasharray: 4 3; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 1 L6 4 L0 7" fill="none" stroke="hsl(var(--muted-foreground))" stroke-width="1"/>
    </marker>
  </defs>

  <rect class="zone" x="8" y="20" width="200" height="150" rx="8"/>
  <text class="note" x="18" y="38">editor</text>

  <rect class="box" x="28" y="50" width="160" height="30" rx="8"/>
  <text class="lbl" x="42" y="70">Upload photo</text>
  <rect class="box" x="28" y="90" width="160" height="30" rx="8"/>
  <text class="lbl" x="42" y="110">Upload cover</text>
  <rect class="box" x="28" y="130" width="160" height="30" rx="8"/>
  <text class="lbl" x="42" y="150">Upload intro video</text>

  <path class="wire" d="M188 105 L250 105" marker-end="url(#a)"/>

  <rect class="box" x="252" y="70" width="150" height="70" rx="8" fill="hsl(var(--muted))"/>
  <text class="lbl" x="268" y="100">public media</text>
  <text class="note" x="268" y="120">community-media</text>

  <path class="wire" d="M402 105 L462 105" marker-end="url(#a)"/>

  <rect class="box" x="464" y="50" width="160" height="110" rx="8"/>
  <text class="lbl" x="480" y="80">Public profile</text>
  <text class="note" x="480" y="102">photo · cover</text>
  <text class="note" x="480" y="120">intro video</text>

  <circle cx="270" cy="200" r="10" fill="hsl(var(--accent))"/>
  <text x="266" y="205" style="font-size:12px; fill: hsl(var(--accent-foreground));">1</text>
  <text class="note" x="290" y="205">Stored link is a real public address, so anyone viewing the profile sees the media.</text>
  <circle cx="270" cy="235" r="10" fill="none" stroke="hsl(var(--muted-foreground))"/>
  <text x="266" y="240" style="font-size:12px;">2</text>
  <text class="note" x="290" y="240">Replacing a file removes the old one; Remove clears the field.</text>
</svg>
