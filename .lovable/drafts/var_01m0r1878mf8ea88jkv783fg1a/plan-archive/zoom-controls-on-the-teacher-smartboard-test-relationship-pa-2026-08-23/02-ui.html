<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" style="font-family: var(--font-sans); color: var(--foreground);">
  <defs>
    <style>
      .box { fill: var(--card); stroke: var(--border); stroke-width: 1; rx: 8; }
      .panel { fill: var(--background); stroke: var(--border); stroke-width: 1; }
      .toolbar { fill: var(--muted); stroke: var(--border); stroke-width: 1; }
      .btn { fill: var(--secondary); stroke: var(--border); stroke-width: 1; rx: 4; }
      .accent { fill: var(--accent); }
      .text { fill: var(--foreground); font-size: 12px; font-weight: 500; }
      .muted { fill: var(--muted-foreground); font-size: 11px; }
      .wire { stroke: var(--border); stroke-width: 1; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="var(--border)"/>
    </marker>
  </defs>

  <!-- Full-screen relationship view -->
  <rect x="20" y="20" width="600" height="320" class="panel" rx="8"/>

  <!-- Top bar -->
  <rect x="20" y="20" width="600" height="38" class="toolbar" rx="8"/>
  <text x="38" y="44" class="text">Close</text>
  <text x="110" y="44" class="muted">Geometry relationships</text>

  <!-- New zoom controls -->
  <g transform="translate(420, 28)">
    <rect x="0" y="0" width="80" height="22" class="btn" rx="4"/>
    <text x="12" y="15" class="text">−</text>
    <text x="32" y="15" class="muted" style="font-size: 10px;">100%</text>
    <text x="62" y="15" class="text">+</text>
  </g>
  <circle cx="460" cy="39" r="10" class="accent" opacity="0.25"/>

  <!-- Diagram area -->
  <rect x="40" y="78" width="380" height="240" class="box"/>
  <polygon points="120,260 200,120 340,260" fill="none" stroke="var(--foreground)" stroke-width="2"/>
  <text x="210" y="210" class="text">△ scaled by zoom</text>

  <!-- Right panel -->
  <rect x="440" y="78" width="160" height="240" class="box"/>
  <text x="460" y="105" class="text">REVIEW PROPERTIES</text>
  <text x="460" y="135" class="muted">EF — black</text>
  <text x="460" y="155" class="muted">FD — blue</text>

  <!-- Annotation -->
  <line x1="460" y1="39" x2="460" y2="78" class="wire" stroke-dasharray="4 3"/>
  <text x="470" y="65" class="muted">New − / % / + group</text>
</svg>
