<svg viewBox="0 0 640 240" xmlns="http://www.w3.org/2000/svg" style="font-family: var(--font-sans)">
  <style>
    .lbl { font-size: 14px; font-weight: 480; fill: hsl(var(--foreground)); }
    .note { font-size: 12px; fill: hsl(var(--muted-foreground)); }
    .tag { font-size: 12px; fill: hsl(var(--muted-foreground)); }
    .bx { fill: none; stroke: hsl(var(--muted-foreground)); stroke-width: 1; }
    .zone { fill: none; stroke: hsl(var(--border)); stroke-width: 1; stroke-dasharray: 4 3; }
  </style>

  <rect class="zone" x="8" y="18" width="290" height="200" rx="8"/>
  <text class="tag" x="20" y="36">today</text>
  <rect class="zone" x="342" y="18" width="290" height="200" rx="8"/>
  <text class="tag" x="354" y="36">after</text>

  <!-- today -->
  <text class="lbl" x="28" y="66">EF · property text is black</text>
  <line x1="28" y1="82" x2="140" y2="82" stroke="hsl(var(--foreground))" stroke-width="3"/>
  <text class="lbl" x="28" y="118">highlight on the diagram</text>
  <line x1="28" y1="134" x2="140" y2="134" stroke="hsl(var(--accent-foreground))" stroke-width="6" opacity="0.35"/>
  <line x1="28" y1="134" x2="140" y2="134" stroke="hsl(var(--accent-foreground))" stroke-width="3"/>
  <text class="note" x="28" y="168">one shared review colour for every</text>
  <text class="note" x="28" y="184">lit part — the authored colour is lost</text>
  <text class="note" x="28" y="200">and the glow is thinner than authoring</text>

  <!-- after -->
  <text class="lbl" x="362" y="66">EF black · FD blue</text>
  <line x1="362" y1="82" x2="474" y2="82" stroke="hsl(var(--foreground))" stroke-width="3"/>
  <line x1="490" y1="82" x2="602" y2="82" stroke="hsl(var(--primary))" stroke-width="3"/>

  <text class="lbl" x="362" y="118">highlight matches each part</text>
  <line x1="362" y1="134" x2="474" y2="134" stroke="hsl(var(--foreground))" stroke-width="9" opacity="0.22"/>
  <line x1="362" y1="134" x2="474" y2="134" stroke="hsl(var(--foreground))" stroke-width="3.5"/>
  <line x1="490" y1="134" x2="602" y2="134" stroke="hsl(var(--primary))" stroke-width="9" opacity="0.22"/>
  <line x1="490" y1="134" x2="602" y2="134" stroke="hsl(var(--primary))" stroke-width="3.5"/>

  <text class="note" x="362" y="168">the lit part wears its own authored</text>
  <text class="note" x="362" y="184">colour, at authoring glow weight —</text>
  <text class="note" x="362" y="200">same rule for angles, arcs and regions</text>
</svg>
