name: Classroom Audio build

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/classroom-audio-build.yml'
      - 'src/lib/classroomAudio/**'
      - 'src/components/smartboard/ClassroomAudio.tsx'
      - 'src/pages/SmartBoardPage.tsx'
      - 'src/pages/student/StudentSmartBoardPage.tsx'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_CLASSROOM_AUDIO_PILOT: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install application and pilot dependencies
        run: npm install --no-save --no-package-lock --legacy-peer-deps livekit-client@2.23.0
      - name: Check pilot integration is present
        run: |
          test -f src/components/smartboard/ClassroomAudio.tsx
          grep -q '<ClassroomAudio' src/pages/SmartBoardPage.tsx
          grep -q '<ClassroomAudio' src/pages/student/StudentSmartBoardPage.tsx
      - run: npm run build
