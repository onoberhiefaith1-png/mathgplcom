# Self-hosted LiveKit for Mathemagine classroom audio.
# Linux only (host networking: WebRTC needs the real UDP port range).
#   ./render-config.sh                      # .env -> generated/*.yaml
#   docker compose up -d                    # livekit + caddy + redis
#   docker compose --profile recording up -d   # also start egress (recording)
name: mathemagine-livekit

services:
  caddy:
    image: livekit/caddyl4:v2.11.3
    command: run --config /etc/caddy.yaml --adapter yaml
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./generated/caddy.yaml:/etc/caddy.yaml:ro
      - ./caddy_data:/data
    depends_on:
      - livekit

  livekit:
    image: livekit/livekit-server:v1.13.11
    command: --config /etc/livekit.yaml
    restart: unless-stopped
    network_mode: host
    environment:
      # API key pair from .env, never written into livekit.yaml.
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY in .env}: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET in .env}"
    volumes:
      - ./generated/livekit.yaml:/etc/livekit.yaml:ro
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    command: redis-server /etc/redis.conf
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./redis.conf:/etc/redis.conf:ro

  # Optional: audio-only track recording to S3-compatible storage (R2, Supabase Storage).
  egress:
    image: livekit/egress:v1.15.0
    profiles: ["recording"]
    restart: unless-stopped
    network_mode: host
    environment:
      EGRESS_CONFIG_FILE: /etc/egress.yaml
    volumes:
      - ./generated/egress.yaml:/etc/egress.yaml:ro
    # Needed only for Chrome-based (room composite/web) egress; harmless for track egress.
    cap_add:
      - SYS_ADMIN
    depends_on:
      - redis
      - livekit
