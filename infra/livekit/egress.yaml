# LiveKit Egress config TEMPLATE (optional recording). render-config.sh fills
# the $-placeholders from .env into generated/egress.yaml (git-ignored, never committed).
logging:
  level: info
api_key: ${LIVEKIT_API_KEY}
api_secret: ${LIVEKIT_API_SECRET}
# Egress talks to LiveKit on the same machine, no TLS needed.
ws_url: ws://localhost:7880
insecure: true
redis:
  address: localhost:6379
health_port: 8099
prometheus_port: 6790

# Audio-only Track Egress writes the teacher's Opus track as .ogg into this bucket.
storage:
  s3:
    access_key: ${EGRESS_S3_ACCESS_KEY}
    secret: ${EGRESS_S3_SECRET}
    region: ${EGRESS_S3_REGION}
    endpoint: ${EGRESS_S3_ENDPOINT}
    bucket: ${EGRESS_S3_BUCKET}
    # R2 and Supabase Storage need path-style URLs.
    force_path_style: true

# Never record for ever if a stop is missed.
session_limits:
  file_output_max_duration: 3h
