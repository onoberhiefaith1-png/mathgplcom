# LiveKit server config TEMPLATE. render-config.sh fills the $-placeholders from .env into
# generated/livekit.yaml. API keys are NOT in this file: docker-compose passes
# them as LIVEKIT_KEYS from .env.
port: 7880
bind_addresses:
  - ""
logging:
  level: info

rtc:
  # WebRTC over UDP (best). Open 50000-60000/udp in BOTH firewalls.
  port_range_start: 50000
  port_range_end: 60000
  # WebRTC over TCP when UDP is blocked.
  tcp_port: 7881
  # Oracle/Hetzner VMs sit behind 1:1 NAT: discover the public IP via STUN.
  use_external_ip: true
  enable_loopback_candidate: false

redis:
  address: localhost:6379

# Built-in TURN. Caddy (caddy.yaml) terminates TLS for ${LK_TURN_DOMAIN} on 443
# and forwards plain TCP to 5349, so school networks that only allow 443 work.
turn:
  enabled: true
  domain: ${LK_TURN_DOMAIN}
  tls_port: 5349
  udp_port: 3478
  external_tls: true

# Rooms the app creates set their own limits (CreateRoom, 1,001 people by default).
room:
  empty_timeout: 300
  departure_timeout: 20

# Prometheus metrics on http://<server>:6789/metrics. Port 6789 is NOT opened
# in the firewall; read it over an SSH tunnel (README "Monitoring").
prometheus:
  port: 6789

# Default node limit is 400 tracks (in+out) per CPU. 4 Oracle OCPUs = 1600,
# enough for 1 teacher + 1000 listeners. Raise or set -1 only after a load test.
# limit:
#   num_tracks: -1
